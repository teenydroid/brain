# Every scheduled job Teeny runs. `bin/seed-cron` makes OpenHuman's cron match
# this file (plus the pinned jobs in evals/cron.pinned.toml) at every boot;
# `bin/crons` shows what the core has and when each job last ran.
#
# Teeny owns this file: it may add, remove or reschedule any job here, the
# heartbeat included. bin/lib/cron_policy.py holds the rules it cannot change:
#
#   [jobs.<name>]          becomes the core job `teeny.<name>`
#   schedule = "m h dom mon dow"   never more often than every 5 minutes
#   command  = "bin/act <playbook>"   brain/playbooks/<playbook>.md
#            | "bin/studio --slot <name> --legacy <playbook> --detach"   a studio slot
#            | "bin/heartbeat"
#   tz       = "..."       optional; else a top-level `tz = "..."`, else
#                          CALENDAR_TZ, else UTC
#   enabled  = false       optional; keeps the job, does not run it
#   catch_up = true        optional; a slot missed across a restart is run
#                          once, late, instead of waiting a day (bin/lib/catch_up.py)
#   catch_up_hours = N     how late, at most (default 6, at most 12, and
#                          2 hours shorter than the gap between the job's
#                          slots); never on a playbook that posts, replies or
#                          comments, which bin/lib/cron_policy.py refuses
#   make_up_hours = N      optional, on a bin/act job; a slot whose every run
#                          failed on the model provider (no money, a refused
#                          key, the provider down) is run once when it answers
#                          again, at most N hours late (at most 6, and 2 hours
#                          shorter than the gap between slots). It is allowed
#                          on a post: that post was never made. A catch_up
#                          playbook makes up such a slot without it.
#
# At most 24 jobs in all, and at most 400 runs of bin/act a day.
#
# Jobs are shell jobs, never agent jobs: a turn cron starts may only use
# read-only tools, so bin/act gathers, the model drafts, and a hand acts
# (docs/architecture.md, §1).

# Proves cron fires in this checkout.
[jobs.heartbeat]
schedule = "*/5 * * * *"
command = "bin/heartbeat"

# Every job below runs a playbook in brain/playbooks/ through bin/act, in
# India time. DRY_RUN in secrets/teeny.env still decides whether anything
# reaches X or Moltbook.
#
# The box is redeployed several times a day, and a restart that cuts off a run
# (or comes while a slot passes) used to drop that slot until the next one: on
# 2026-11-13 and 11-14 self-improve lost both days that way. The daily jobs
# that only read, propose or tend (self-improve, build-idea, pick-request,
# goals, speculate, world-scan, moltbook-follow, moltbook-curate) catch up
# instead. The posts do not: X is at most four posts a day five hours apart,
# and a post hours late is the wrong post, so the X slots (the studio), brief and
# peer-quote (and the Moltbook posts) keep waiting for their next slot. A playbook never
# catches up in the quiet hours, and bin/act's max_per_day still holds.
#
# A slot lost to the model provider is another matter: on 2026-11-14 a 402
# from the provider failed every draft from 06:10 to 09:15 UTC, the noon post
# among them. The Moltbook evening audit says something that is still true
# hours later, so it makes up such a slot once the provider answers
# (`make_up_hours`). The X slots do not: a late post is the wrong post, and X
# keeps five hours between posts, so a late post would cost the next slot. The jobs that run every hour or two (moltbook-general, which now
# carries the noon post too, -threads, -helpdesk) need nothing: their next
# run is soon, and cron_policy.py would refuse a window that long anyway.
#
# Teeny posts on X at most four times a day, five hours apart (hands/x:
# X_POSTS_MAX_PER_DAY and POST_MIN_GAP_HOURS), and every slot is a ceiling, not
# a quota. Since the studio cutover the studio owns every original post
# (docs/architecture.md, "The studio"): one `bin/studio` run a slot, at 04:30
# (the US afternoon), 09:30, 15:00 and 23:00 IST, each at least five hours
# from the next. A run pitches from what really happened, drafts the best
# pitches, has an editor pick one or none, and puts the pick through the truth
# judge, the cold reader and the guard before hands/x; an empty slot is a
# normal outcome. Sunday's 15:00 is a normal studio slot for now (the weekly
# plan that will take it arrives in a later change).
#
# The rollback is STUDIO=0 in secrets/teeny.env, and nothing here changes for
# it: each studio job names the old playbook of its slot (`--legacy`), and
# with STUDIO=0 bin/studio runs that playbook through bin/act instead, as
# cron did before (x-quote, morning, take Monday to Saturday, growth on
# Sunday, show). `shiplog` keeps its own job at 23:10 and runs only with
# STUDIO=0: bin/act skips every replaced playbook while STUDIO=1
# (bin/lib/studio_switch.py). No studio slot catches up or makes up: a late
# post would take the next slot's room, and cron_policy.py refuses it. Each
# runs detached (--detach: the run outlasts the 300 s the core gives a cron
# call) under the studio lock, and claims its slot before any model turn, so
# a retry or a rerun of a slot that already ran does nothing.
#
# Two posts keep their own jobs and draw on the same four a day: the team's
# told-to post (`brief`) and the outward quote of a peer (`peer-quote`, 11:00
# and 19:00: it posts only at relevance 5 and at most once a day). With
# STUDIO=1 both go past the studio's editor as a single candidate, pick or
# none (bin/act, `bin/studio --veto`). The brief runs five minutes before the
# 15:00 and 23:00 slots: a brief that goes out shuts that slot (the five-hour
# gap), and the studio run reads `hands/x slot` first and skips before any
# model turn; with none queued, or one the editor passed on, the slot is the
# studio's as usual. Replies to mentions are not posts and keep running, under
# a looser bar. Moltbook is its own
# audience and is where Teeny grows: eight to ten posts a day, a post every
# hour from 07:40 until its nine are out, unless there is nothing new to say (`moltbook-general`,
# at most 9 a day) and the evening audit in a slow submolt (`moltbook-evening`),
# comments in the big general threads (at most 15) and on its helpdesk (at
# most 12), a few honest upvotes, and a daily follow. Answers to comments on
# its own posts come from the mind. Together that stays under hands/moltbook's
# own caps (20 posts, 50 comments and 30 follows a day) and at Moltbook's
# limits (50 comments, a post per 30 minutes). The hand owns the timing: the
# 30 minutes count from the last post only (a comment or a follow does not
# restart them), and a post that comes too soon is refused with the wait and
# costs nothing, so the post jobs never skip for timing in the draft. They ask
# the hand first instead (`hands/moltbook post-slot`): a shut gap skips the run
# before the model turn, and one that opens within two minutes is waited out.

# The 04:30 slot (the US afternoon). With STUDIO=0: at most one quote a day
# of a small builder's post (brain/playbooks/x-quote.md).
[jobs.studio-0430]
schedule = "30 4 * * *"
tz = "Asia/Kolkata"
command = "bin/studio --slot 0430 --legacy x-quote --detach"

# The 09:30 slot. With STUDIO=0: a gm only when the morning's reading gave
# Teeny an anchor (brain/playbooks/morning.md, a nudge to the mind).
[jobs.studio-0930]
schedule = "30 9 * * *"
tz = "Asia/Kolkata"
command = "bin/studio --slot 0930 --legacy morning --detach"

# The 15:00 slot, Monday to Saturday. With STUDIO=0: a take on the day's
# story, or a quote of a builder's post (brain/playbooks/take.md).
[jobs.studio-1500]
schedule = "0 15 * * 1-6"
tz = "Asia/Kolkata"
command = "bin/studio --slot 1500 --legacy take --detach"

# The 15:00 slot on Sunday: a normal studio slot. With STUDIO=0: the weekly
# growth diary (brain/playbooks/growth.md), as before.
[jobs.studio-sunday]
schedule = "0 15 * * 0"
tz = "Asia/Kolkata"
command = "bin/studio --slot 1500 --legacy growth --detach"

# The 23:00 slot. With STUDIO=0: what Teeny built or did today, with
# pictures, or the day's best exchange on Moltbook (brain/playbooks/show.md).
[jobs.studio-2300]
schedule = "0 23 * * *"
tz = "Asia/Kolkata"
command = "bin/studio --slot 2300 --legacy show --detach"

# The outward quote: up to three scored suggestions a run from the peers' new
# posts (brain/x-peers.txt), and hands/x peer-suggest posts one only when its
# relevance is 5 of 5, the studio's editor did not pass on it (STUDIO=1), and
# at most once a day, so the 19:00 run does nothing if the 11:00 one posted.
# Most runs end in a skip. No catch-up: a late quote is the wrong quote.
[jobs.peer-quote]
schedule = "0 11,19 * * *"
tz = "Asia/Kolkata"
command = "bin/act peer-quote"

# The nightly ship log (brain/playbooks/shiplog.md), legacy: it runs only with
# STUDIO=0 (bin/act skips it otherwise), ten minutes after show, and posts
# only on a night show and the brief left the slot empty (it reads `hands/x
# slot` first).
[jobs.shiplog]
schedule = "10 23 * * *"
tz = "Asia/Kolkata"
command = "bin/act shiplog"

# Choose what the builder makes next when nobody has a request waiting
# (brain/playbooks/build-idea.md): one idea a day, with who wants it and where
# the need shows (people's asks, and what the ears heard: hands/listen
# digest), kept with hands/build idea. The daily job is made at the first desk
# run after UTC midnight (05:30 here), so the idea is drafted the evening
# before, when Hacker News is busiest. It took the slot of the roast job, which
# was off; brain/playbooks/roast.md is still in the tree. 22:50, not 23:00:
# the 23:00 studio slot owns that minute, and two jobs on one schedule have lost one
# (`shipped` beside `moltbook-evening` at 19:30 never ran on the box,
# 11-11 to 11-13, while moltbook-evening ran every day).
[jobs.build-idea]
schedule = "50 22 * * *"
tz = "Asia/Kolkata"
command = "bin/act build-idea"
catch_up = true

# Propose one change to myself (a prompt, a playbook, a skill or a new hand),
# once a day. It goes in as a build request from myself; pick-request picks it
# like any other, the builder makes it in my own clone, and it ships as a pull
# request the operator merges or closes (docs/evolve.md). Ten past, off the
# 15:00 studio slot's minute (see build-idea), and still before pick-request's 15:20.
[jobs.self-improve]
schedule = "10 15 * * *"
tz = "Asia/Kolkata"
command = "bin/act self-improve"
catch_up = true

# Propose one goal of my own, once a week (brain/playbooks/goals.md): in the
# learnability band, naming the W component it moves, with a check from the
# fixed kinds that the pinned goals-check job runs. At most three tries a day,
# since a near-duplicate is refused and costs nothing.
[jobs.goals]
schedule = "0 11 * * 1"
tz = "Asia/Kolkata"
command = "bin/act goals"
catch_up = true

# The world sense: twice a day my ears listen (hands/listen scan: who is
# talking about me, Hacker News on my topics, Lobsters, the agent repositories
# people star on GitHub, the newest agent papers on arXiv; only what is new),
# with the HN front page and Moltbook's hot page, and I get it as a nudge
# (brain/playbooks/world-scan.md). It feeds the posts, never takes an X slot:
# 13:05 lands before the 15:00 studio slot, 22:05 (the US working day, when Hacker
# News is busiest) before `build-idea` and the 23:00 slot, which read what
# was heard (hands/listen digest), as do the Moltbook posts. It
# took the place of news-scan, which queued a browser task to read the HN
# front page; that playbook is still in the tree, unscheduled.
[jobs.world-scan]
schedule = "5 13,22 * * *"
tz = "Asia/Kolkata"
command = "bin/act world-scan"
catch_up = true

# Pick the next build request for the builder, one at a time: people's asks
# and my own self-improve proposals. Twenty past, so a proposal made at the
# hour is picked the same afternoon and built at the builder's next run.
[jobs.pick-request]
schedule = "20 9,15 * * *"
tz = "Asia/Kolkata"
command = "bin/act pick-request"
catch_up = true
catch_up_hours = 3

# Answer the questions agents ask on Moltbook (at most 12 a day), and file a
# problem agents keep naming as a build request (hands/moltbook helpdesk, at
# most one a day). pick-request picks it like any other ask; when the builder
# ships it, the mind is told where it was voiced and announces it in m/builds
# and in those threads (build/jobs.py, `builder · shipped`).
[jobs.moltbook-helpdesk]
schedule = "15 8-22/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-helpdesk"

# The evening audit on Moltbook: one measurement over several days (guard
# holds, challenge outcomes) with the count in the title, reported again as it
# grows, in a slow submolt (security, infrastructure, ...). 19:40 takes the
# hour moltbook-general leaves out, so the two never meet inside 30 minutes.
[jobs.moltbook-evening]
schedule = "40 19 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-evening"
make_up_hours = 3

# Comment on new posts (under 2-3 hours old, the hand filters the feed) by
# agents under about 10k karma in m/general and the slow rooms, and on the
# peers' new posts: one detail from Teeny's record and one question (at most
# 3 a run, 15 a day). The hand refuses a top-level comment on another agent's
# post older than MOLTBOOK_MAX_COMMENT_AGE_HOURS (6).
[jobs.moltbook-threads]
schedule = "45 9-21/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-threads"

# Upvote what genuinely helped, once a day (at most 10).
[jobs.moltbook-curate]
schedule = "30 21 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-curate"
catch_up = true

# Follow the agents Teeny has had a real exchange with (`hands/moltbook
# exchanges`) and its peers, every day; skipped when there is nobody (at most
# 5 a run; the hand caps follows at 30 a day). A weekly pinned job
# (moltbook-prune) unfollows whoever did not follow back after 7 days, except
# peers and agents with a real exchange in the last 14 days.
[jobs.moltbook-follow]
schedule = "0 17 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-follow"
catch_up = true

# A Moltbook post every hour until the day's nine are out, in one of seven formats
# (confession, claim, question, news, audit, finding, answer), in m/general or,
# two or three times a day, a slow submolt picked by subject. A run skips only
# when `material` holds nothing new. At most 9 a day, 15 runs for them, so a
# run lost to a refusal or an outage is made up later the same day; with the
# evening audit that is 10, under the hand's 20. It took the noon post's job
# too: moltbook-daily ran five days without one live post (one try a day, so a
# pending challenge, a crypto refusal or an outage lost the day), and its
# playbook stays in the tree, unscheduled. Not at 19: moltbook-evening has it.
[jobs.moltbook-general]
schedule = "40 7-18,20-22 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-general"

# The told-to post: whatever the team queued with `hands/brief add "..."`
# (brain/playbooks/brief.md). It takes a slot instead of adding a post: it
# runs five minutes before the 15:00 and 23:00 studio slots, and a brief that
# goes out shuts that slot for the studio (the five-hour gap). It posts once a
# day at most, and with STUDIO=1 only when the studio's editor picks it (a
# brief it passes on stays queued for the next run). With no brief queued it
# skips before drafting, so a quiet run costs no model turn. hands/x's cap (4
# posts a day) and 5-hour gap still apply: a brief queued after today's slots
# waits for tomorrow's. Mentions are answered by the pinned mentions-inbound
# job (evals/cron.pinned.toml).
[jobs.brief]
schedule = "55 14,22 * * *"
tz = "Asia/Kolkata"
command = "bin/act brief"

# Speculate (speculate.md): once a day the mind gets the scoreboard, the
# open experiments, the lab's lessons and what wins this week, searches how
# small accounts grow on the surface that did worst, and proposes one
# experiment. A nudge, not a draft: only the mind can search. It took the
# growth diary's old slot; the diary (growth.md) posts on Sundays at 15:00 with STUDIO=0.
[jobs.speculate]
schedule = "30 11 * * *"
tz = "Asia/Kolkata"
command = "bin/act speculate"
catch_up = true

# Open the week's Tiny Drop inside the season budget (giveaway-plan.md),
# Tuesdays at 14:50, ten minutes before the 15:00 slot: on a day a drop opens,
# the announce takes that slot and the 15:00 studio run finds it shut
# (a refused post spends nothing). The hand refuses while GIVEAWAYS is off, and this stays
# off until the devnet rehearsal has passed. The drop's countdown, judging
# and reveal are drafted by giveaway-judge.md and giveaway-post.md, which the
# pinned giveaway-settle job runs when `hands/giveaway announcements` owes
# one (no slot here: brain jobs are capped at 24).
[jobs.giveaway-plan]
schedule = "50 14 * * 2"
tz = "Asia/Kolkata"
command = "bin/act giveaway-plan"
enabled = false

# Read Reddit through the browser operator (reddit-browse.md): every two
# hours, the next allowlisted subreddit in turn (its threads and its rules),
# then the inbox. What it read reaches the mind, which comments, replies and
# votes through its reddit_* intents, so the growth loop needs no other slot.
# A run with nothing due skips before the model (`hands/reddit due`).
[jobs.reddit-browse]
schedule = "35 */2 * * *"
command = "bin/act reddit-browse"
