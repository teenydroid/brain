# Every scheduled job Teeny runs. `bin/seed-cron` makes OpenHuman's cron match
# this file (plus the pinned jobs in evals/cron.pinned.toml) at every boot;
# `bin/crons` shows what the core has and when each job last ran.
#
# Teeny owns this file: it may add, remove or reschedule any job here, the
# heartbeat included. bin/lib/cron_policy.py holds the rules it cannot change:
#
#   [jobs.<name>]          becomes the core job `teeny.<name>`
#   schedule = "m h dom mon dow"   never more often than every 5 minutes
#   command  = "bin/act <playbook>"   brain/playbooks/<playbook>.md
#            | "bin/heartbeat"
#   tz       = "..."       optional; else a top-level `tz = "..."`, else
#                          CALENDAR_TZ, else UTC
#   enabled  = false       optional; keeps the job, does not run it
#
# At most 24 jobs in all, and at most 400 runs of bin/act a day.
#
# Jobs are shell jobs, never agent jobs: a turn cron starts may only use
# read-only tools, so bin/act gathers, the model drafts, and a hand acts
# (docs/architecture.md, §1).

# Proves cron fires in this checkout.
[jobs.heartbeat]
schedule = "*/5 * * * *"
command = "bin/heartbeat"

# The morning post. Off until DRY_RUN has been watched on the box.
[jobs.morning]
schedule = "0 7 * * *"
tz = "Asia/Kolkata"
command = "bin/act morning"
enabled = false

# Answer mentions. Off until DRY_RUN has been watched on the box.
[jobs.mentions]
schedule = "*/15 * * * *"
command = "bin/act mentions"
enabled = false

# A receipt post for each payment the wallet made (brain/playbooks/wallet-receipt.md).
# Off until the wallet is set up and DRY_RUN has been watched on the box.
[jobs.wallet-receipt]
schedule = "17 */3 * * *"
command = "bin/act wallet-receipt"
enabled = false

# The weekly cost of keeping Teeny running, real numbers only (cost-of-living.md).
[jobs.cost-of-living]
schedule = "0 16 * * 0"
command = "bin/act cost-of-living"
enabled = false

# Pick and announce the winner of a bounty past its deadline (bounty-winner.md).
# bin/bounty-pay (pinned) pays it after the challenge window.
[jobs.bounty-winner]
schedule = "40 15 * * *"
command = "bin/act bounty-winner"
enabled = false
