# Every scheduled job Teeny runs. `bin/seed-cron` makes OpenHuman's cron match
# this file (plus the pinned jobs in evals/cron.pinned.toml) at every boot;
# `bin/crons` shows what the core has and when each job last ran.
#
# Teeny owns this file: it may add, remove or reschedule any job here, the
# heartbeat included. bin/lib/cron_policy.py holds the rules it cannot change:
#
#   [jobs.<name>]          becomes the core job `teeny.<name>`
#   schedule = "m h dom mon dow"   never more often than every 5 minutes
#   command  = "bin/act <playbook>"   brain/playbooks/<playbook>.md
#            | "bin/heartbeat"
#   tz       = "..."       optional; else a top-level `tz = "..."`, else
#                          CALENDAR_TZ, else UTC
#   enabled  = false       optional; keeps the job, does not run it
#
# At most 24 jobs in all, and at most 400 runs of bin/act a day.
#
# Jobs are shell jobs, never agent jobs: a turn cron starts may only use
# read-only tools, so bin/act gathers, the model drafts, and a hand acts
# (docs/architecture.md, §1).

# Proves cron fires in this checkout.
[jobs.heartbeat]
schedule = "*/5 * * * *"
command = "bin/heartbeat"

# Every job below runs a playbook in brain/playbooks/ through bin/act, in
# India time. DRY_RUN in secrets/teeny.env still decides whether anything
# reaches X or Moltbook.
#
# Teeny posts on X up to three times a day: the morning gm, one post about
# whatever the team asked for (`brief`, below; only when a brief is queued),
# and one about what shipped (`shipped`; only on a day something did).
# hands/x keeps its own posts three hours apart. Every other X post job is
# kept here but off (`enabled = false`); turn one back on to bring it back.
# Replies to mentions are not posts and keep running. Moltbook is its own
# audience and is where Teeny grows: a noon post and an evening post, a post
# in m/general about once an hour when it has something to say (`moltbook-general`,
# at most 12 a day), comments in the big general threads (at most 15) and on its
# helpdesk (at most 12), a few honest upvotes, and a daily follow. Answers to
# comments on its own posts come from the mind. Together that stays under
# hands/moltbook's own caps (20 posts, 50 comments and 30 follows a day) and
# at Moltbook's limits (50 comments, a post per 30 minutes).

# The morning post.
[jobs.morning]
schedule = "0 7 * * *"
tz = "Asia/Kolkata"
command = "bin/act morning"

# Things I don't understand about humans, three times a week.
[jobs.humans]
schedule = "30 10 * * 1,3,5"
tz = "Asia/Kolkata"
command = "bin/act humans"
enabled = false

# A first proven in bin/proofs, or a round number crossed this week, posted
# only through hands/firsts announce, which checks it again (docs/roadmap.md, P3).
[jobs.milestone]
schedule = "30 13 * * *"
tz = "Asia/Kolkata"
command = "bin/act milestone"
enabled = false

# A pull request merged into somebody else's project.
[jobs.pr-merged]
schedule = "30 16 * * *"
tz = "Asia/Kolkata"
command = "bin/act pr-merged"
enabled = false

# What shipped today, and what broke. Skips a day with nothing but chores.
[jobs.shipped]
schedule = "30 19 * * *"
tz = "Asia/Kolkata"
command = "bin/act shipped"

# The nightly ship log: day n, from GitHub and the stats table.
[jobs.shiplog]
schedule = "30 22 * * *"
tz = "Asia/Kolkata"
command = "bin/act shiplog"
enabled = false

# Choose what the builder makes next when nobody has a request waiting
# (brain/playbooks/build-idea.md): one idea a day, with who wants it and where
# the need shows, kept with hands/build idea. The daily job is made at the
# first desk run after UTC midnight (05:30 here), so the idea is drafted the
# evening before, when Hacker News is busiest. It took the slot of the roast
# job, which was off; brain/playbooks/roast.md is still in the tree.
[jobs.build-idea]
schedule = "0 23 * * *"
tz = "Asia/Kolkata"
command = "bin/act build-idea"

# Propose one change to myself (a prompt, a playbook, a skill or a new hand),
# once a day. It goes in as a build request from myself; pick-request picks it
# like any other, the builder makes it in my own clone, and it ships as a pull
# request the operator merges or closes (docs/evolve.md).
[jobs.self-improve]
schedule = "0 15 * * *"
tz = "Asia/Kolkata"
command = "bin/act self-improve"

# Propose one goal of my own, once a week (brain/playbooks/goals.md): in the
# learnability band, naming the W component it moves, with a check from the
# fixed kinds that the pinned goals-check job runs. At most three tries a day,
# since a near-duplicate is refused and costs nothing.
[jobs.goals]
schedule = "0 11 * * 1"
tz = "Asia/Kolkata"
command = "bin/act goals"

# The world sense: once a day my hands read Hacker News (top, show, ask) and
# Moltbook's hot page, and I get them as a nudge (brain/playbooks/world-scan.md):
# up to three things I have a take on, and what I do with each. It took the
# place of news-scan, which queued a browser task to read the same front page;
# that playbook is still in the tree, unscheduled.
[jobs.world-scan]
schedule = "5 8 * * *"
tz = "Asia/Kolkata"
command = "bin/act world-scan"

# Pick the next build request for the builder, one at a time: people's asks
# and my own self-improve proposals. Twenty past, so a proposal made at the
# hour is picked the same afternoon and built at the builder's next run.
[jobs.pick-request]
schedule = "20 9,15 * * *"
tz = "Asia/Kolkata"
command = "bin/act pick-request"

# The noon post for the agents on Moltbook, in m/general: a confession or a
# claim, from what actually happened to Teeny.
[jobs.moltbook-daily]
schedule = "0 12 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-daily"

# Answer the questions agents ask on Moltbook (at most 5 comments a day).
[jobs.moltbook-helpdesk]
schedule = "15 8-22/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-helpdesk"

# An evening news item or real question on Moltbook.
[jobs.moltbook-evening]
schedule = "30 19 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-evening"

# Join the day's biggest m/general threads while they are young, with a
# counter-example (at most 3 a run, 15 a day).
[jobs.moltbook-threads]
schedule = "45 9-21/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-threads"

# Upvote what genuinely helped, once a day (at most 10).
[jobs.moltbook-curate]
schedule = "30 21 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-curate"

# Follow the agents who follow Teeny, talk to it or write well, every day (at
# most 25 a run; the hand caps follows at 30 a day). A weekly pinned job
# (moltbook-prune) unfollows whoever did not follow back after 7 days.
[jobs.moltbook-follow]
schedule = "0 17 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-follow"

# A post in m/general in one of four formats, hourly through the day; most runs
# skip. At most 12 a day (the hand's own cap is 20 with the noon and evening posts).
[jobs.moltbook-general]
schedule = "40 7-22 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-general"

# The told-to post: whatever the team queued with `hands/brief add "..."`
# (brain/playbooks/brief.md). Checks every 15 minutes and posts once a day at
# most; with no brief queued it skips before drafting, so a quiet check costs
# no model turn. hands/x's three-hour gap still applies: a brief queued right
# after the morning post waits until the gap has passed. Mentions are answered
# by the pinned mentions-inbound job (evals/cron.pinned.toml).
[jobs.brief]
schedule = "*/15 * * * *"
command = "bin/act brief"

# A receipt post for each payment the wallet made (brain/playbooks/wallet-receipt.md).
# Off until the wallet is set up and DRY_RUN has been watched on the box.
[jobs.wallet-receipt]
schedule = "17 */3 * * *"
command = "bin/act wallet-receipt"
enabled = false

# Speculate (speculate.md): once a day the mind gets the scoreboard, the
# open experiments, the lab's lessons and what wins this week, searches how
# small accounts grow on the surface that did worst, and proposes one
# experiment. A nudge, not a draft: only the mind can search. Took the slot
# of the weekly growth diary (growth.md), which was off.
[jobs.speculate]
schedule = "30 11 * * *"
tz = "Asia/Kolkata"
command = "bin/act speculate"

# The weekly cost of keeping Teeny running, real numbers only (cost-of-living.md).
[jobs.cost-of-living]
schedule = "0 16 * * 0"
command = "bin/act cost-of-living"
enabled = false

# Pick and announce the winner of a bounty past its deadline (bounty-winner.md).
# bin/bounty-pay (pinned) pays it after the challenge window.
[jobs.bounty-winner]
schedule = "40 15 * * *"
command = "bin/act bounty-winner"
enabled = false
