# Every scheduled job Teeny runs. `bin/seed-cron` makes OpenHuman's cron match
# this file (plus the pinned jobs in evals/cron.pinned.toml) at every boot;
# `bin/crons` shows what the core has and when each job last ran.
#
# Teeny owns this file: it may add, remove or reschedule any job here, the
# heartbeat included. bin/lib/cron_policy.py holds the rules it cannot change:
#
#   [jobs.<name>]          becomes the core job `teeny.<name>`
#   schedule = "m h dom mon dow"   never more often than every 5 minutes
#   command  = "bin/act <playbook>"   brain/playbooks/<playbook>.md
#            | "bin/heartbeat"
#   tz       = "..."       optional; else a top-level `tz = "..."`, else
#                          CALENDAR_TZ, else UTC
#   enabled  = false       optional; keeps the job, does not run it
#   catch_up = true        optional; a slot missed across a restart is run
#                          once, late, instead of waiting a day (bin/lib/catch_up.py)
#   catch_up_hours = N     how late, at most (default 6, at most 12, and
#                          2 hours shorter than the gap between the job's
#                          slots); never on a playbook that posts, replies or
#                          comments, which bin/lib/cron_policy.py refuses
#   make_up_hours = N      optional, on a bin/act job; a slot whose every run
#                          failed on the model provider (no money, a refused
#                          key, the provider down) is run once when it answers
#                          again, at most N hours late (at most 6, and 2 hours
#                          shorter than the gap between slots). It is allowed
#                          on a post: that post was never made. A catch_up
#                          playbook makes up such a slot without it.
#
# At most 24 jobs in all, and at most 400 runs of bin/act a day.
#
# Jobs are shell jobs, never agent jobs: a turn cron starts may only use
# read-only tools, so bin/act gathers, the model drafts, and a hand acts
# (docs/architecture.md, §1).

# Proves cron fires in this checkout.
[jobs.heartbeat]
schedule = "*/5 * * * *"
command = "bin/heartbeat"

# Every job below runs a playbook in brain/playbooks/ through bin/act, in
# India time. DRY_RUN in secrets/teeny.env still decides whether anything
# reaches X or Moltbook.
#
# The box is redeployed several times a day, and a restart that cuts off a run
# (or comes while a slot passes) used to drop that slot until the next one: on
# 2026-11-13 and 11-14 self-improve lost both days that way. The daily jobs
# that only read, propose or tend (self-improve, build-idea, pick-request,
# goals, speculate, world-scan, moltbook-follow, moltbook-curate) catch up
# instead. The posts do not: X is at most four posts a day five hours apart,
# and a gm or a take hours late is the wrong post, so the X posts and brief
# (and the Moltbook posts) keep waiting for their next slot. A playbook never
# catches up in the quiet hours, and bin/act's max_per_day still holds.
#
# A slot lost to the model provider is another matter: on 2026-11-14 a 402
# from the provider failed every draft from 06:10 to 09:15 UTC, the noon post
# among them. The Moltbook evening audit says something that is still true
# hours later, so it makes up such a slot once the provider answers
# (`make_up_hours`). The X posts do not: a late gm is the wrong post, and X
# keeps five hours between posts, so a late post would cost the next slot. The jobs that run every hour or two (moltbook-general, which now
# carries the noon post too, -threads, -helpdesk) need nothing: their next
# run is soon, and cron_policy.py would refuse a window that long anyway.
#
# Teeny posts on X at most four times a day, five hours apart (hands/x:
# X_POSTS_MAX_PER_DAY and POST_MIN_GAP_HOURS), and every slot is a ceiling, not
# a quota: a post names the one item from its inputs it is about (`anchor`),
# carries something from Teeny's own record, and passes bin/act's anchor judge,
# or the slot stays empty. The slots, in IST: 04:30 one quote of a small
# builder's post (`x-quote`, US afternoon), 09:30 a gm only when the morning's
# reading gave it something (`morning`), 15:00 a take or a quote (`take`; on
# Sundays the weekly growth diary, `growth`, has the slot), and 23:00 what it
# built or did today (`show`); each is at least five hours from the next. The
# team's `brief` takes the next free slot instead of a fifth: it runs five
# minutes after `take` and `show`, which skip when a brief is queued. The
# nightly `shiplog` runs ten minutes after `show` and takes the night's slot
# only when show and the brief left it empty: it reads `hands/x slot` first,
# and a shut slot skips before any model turn. Replies to mentions are not
# posts and keep running, under a looser bar. Moltbook is its own
# The 04:30 post (US afternoon): at most one quote a day of a small builder's
# post, adding one fact from Teeny's own record (brain/playbooks/x-quote.md).
# Five and a half hours after show, five before morning. It reads `hands/x
# slot` before its search, so a shut slot costs no search.
[jobs.x-quote]
schedule = "30 4 * * *"
tz = "Asia/Kolkata"
command = "bin/act x-quote"

# The 09:30 post: a gm only when the morning's reading gave Teeny an anchor.
# Not 07:00 any more: the 04:30 quote needs five hours before it.
[jobs.morning]
schedule = "30 9 * * *"
tz = "Asia/Kolkata"
command = "bin/act morning"

# The 23:00 post: what Teeny built or did today, with pictures, and what broke.
# When it is the better story, the day's best exchange on Moltbook instead
# (hands/moltbook highlight, format `moltbook`): Moltbook sends nobody to X, so
# Teeny carries it there, in this slot, never as an extra post. Skips a day
# with nothing but chores and no exchange.
[jobs.show]
schedule = "0 23 * * *"
tz = "Asia/Kolkata"
command = "bin/act show"

# The 15:00 post: a take on the day's story, or a quote of a builder's post,
# Monday to Saturday. On Sunday the slot is the weekly growth diary's.
[jobs.take]
schedule = "0 15 * * 1-6"
tz = "Asia/Kolkata"
command = "bin/act take"

# The weekly growth diary (brain/playbooks/growth.md): world score W in real
# numbers, what grew and what failed, in take's Sunday 15:00 slot.
[jobs.growth]
schedule = "0 15 * * 0"
tz = "Asia/Kolkata"
command = "bin/act growth"

# The nightly ship log (brain/playbooks/shiplog.md): day n and what shipped,
# ten minutes after show and five after the brief. It reads `hands/x slot`
# first, so it posts only on a night show and the brief left the slot empty.
[jobs.shiplog]
schedule = "10 23 * * *"
tz = "Asia/Kolkata"
command = "bin/act shiplog"

# Choose what the builder makes next when nobody has a request waiting
# (brain/playbooks/build-idea.md): one idea a day, with who wants it and where
# the need shows (people's asks, and what the ears heard: hands/listen
# digest), kept with hands/build idea. The daily job is made at the first desk
# run after UTC midnight (05:30 here), so the idea is drafted the evening
# before, when Hacker News is busiest. It took the slot of the roast job, which
# was off; brain/playbooks/roast.md is still in the tree. 22:50, not 23:00:
# `show` owns that minute, and two jobs on one schedule have lost one
# (`shipped` beside `moltbook-evening` at 19:30 never ran on the box,
# 11-11 to 11-13, while moltbook-evening ran every day).
[jobs.build-idea]
schedule = "50 22 * * *"
tz = "Asia/Kolkata"
command = "bin/act build-idea"
catch_up = true

# Propose one change to myself (a prompt, a playbook, a skill or a new hand),
# once a day. It goes in as a build request from myself; pick-request picks it
# like any other, the builder makes it in my own clone, and it ships as a pull
# request the operator merges or closes (docs/evolve.md). Ten past, off the
# 15:00 `take`'s minute (see build-idea), and still before pick-request's 15:20.
[jobs.self-improve]
schedule = "10 15 * * *"
tz = "Asia/Kolkata"
command = "bin/act self-improve"
catch_up = true

# Propose one goal of my own, once a week (brain/playbooks/goals.md): in the
# learnability band, naming the W component it moves, with a check from the
# fixed kinds that the pinned goals-check job runs. At most three tries a day,
# since a near-duplicate is refused and costs nothing.
[jobs.goals]
schedule = "0 11 * * 1"
tz = "Asia/Kolkata"
command = "bin/act goals"
catch_up = true

# The world sense: twice a day my ears listen (hands/listen scan: who is
# talking about me, Hacker News on my topics, Lobsters, the agent repositories
# people star on GitHub, the newest agent papers on arXiv; only what is new),
# with the HN front page and Moltbook's hot page, and I get it as a nudge
# (brain/playbooks/world-scan.md). It feeds the posts, never takes an X slot:
# 13:05 lands before the 15:00 `take`, 22:05 (the US working day, when Hacker
# News is busiest) before `build-idea` and the 23:00 `show`, which read what
# was heard (hands/listen digest), as do the gm and the Moltbook posts. It
# took the place of news-scan, which queued a browser task to read the HN
# front page; that playbook is still in the tree, unscheduled.
[jobs.world-scan]
schedule = "5 13,22 * * *"
tz = "Asia/Kolkata"
command = "bin/act world-scan"
catch_up = true

# Pick the next build request for the builder, one at a time: people's asks
# and my own self-improve proposals. Twenty past, so a proposal made at the
# hour is picked the same afternoon and built at the builder's next run.
[jobs.pick-request]
schedule = "20 9,15 * * *"
tz = "Asia/Kolkata"
command = "bin/act pick-request"
catch_up = true
catch_up_hours = 3

# Answer the questions agents ask on Moltbook (at most 12 a day), and file a
# problem agents keep naming as a build request (hands/moltbook helpdesk, at
# most one a day). pick-request picks it like any other ask; when the builder
# ships it, the mind is told where it was voiced and announces it in m/builds
# and in those threads (build/jobs.py, `builder · shipped`).
[jobs.moltbook-helpdesk]
schedule = "15 8-22/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-helpdesk"

# The evening audit on Moltbook: one measurement over several days (guard
# holds, challenge outcomes) with the count in the title, reported again as it
# grows, in a slow submolt (security, infrastructure, ...). 19:40 takes the
# hour moltbook-general leaves out, so the two never meet inside 30 minutes.
[jobs.moltbook-evening]
schedule = "40 19 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-evening"
make_up_hours = 3

# Comment on new posts (under 2-3 hours old, the hand filters the feed) by
# agents under about 10k karma in m/general and the slow rooms, and on the
# peers' new posts: one detail from Teeny's record and one question (at most
# 3 a run, 15 a day). The hand refuses a top-level comment on another agent's
# post older than MOLTBOOK_MAX_COMMENT_AGE_HOURS (6).
[jobs.moltbook-threads]
schedule = "45 9-21/2 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-threads"

# Upvote what genuinely helped, once a day (at most 10).
[jobs.moltbook-curate]
schedule = "30 21 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-curate"
catch_up = true

# Follow the agents Teeny has had a real exchange with (`hands/moltbook
# exchanges`) and its peers, every day; skipped when there is nobody (at most
# 5 a run; the hand caps follows at 30 a day). A weekly pinned job
# (moltbook-prune) unfollows whoever did not follow back after 7 days, except
# peers and agents with a real exchange in the last 14 days.
[jobs.moltbook-follow]
schedule = "0 17 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-follow"
catch_up = true

# A Moltbook post every hour until the day's nine are out, in one of seven formats
# (confession, claim, question, news, audit, finding, answer), in m/general or,
# two or three times a day, a slow submolt picked by subject. A run skips only
# when `material` holds nothing new. At most 9 a day, 15 runs for them, so a
# run lost to a refusal or an outage is made up later the same day; with the
# evening audit that is 10, under the hand's 20. It took the noon post's job
# too: moltbook-daily ran five days without one live post (one try a day, so a
# pending challenge, a crypto refusal or an outage lost the day), and its
# playbook stays in the tree, unscheduled. Not at 19: moltbook-evening has it.
[jobs.moltbook-general]
schedule = "40 7-18,20-22 * * *"
tz = "Asia/Kolkata"
command = "bin/act moltbook-general"

# The told-to post: whatever the team queued with `hands/brief add "..."`
# (brain/playbooks/brief.md). It takes the next free X slot instead of adding a
# post: it runs five minutes after `take` (15:00) and `show` (23:00),
# which skip while a brief is queued, and posts once a day at most. With no
# brief queued it skips before drafting, so a quiet run costs no model turn.
# hands/x's cap (4 posts a day) and 5-hour gap still apply: a brief queued after
# today's slots waits for tomorrow's. Mentions are answered by the pinned
# mentions-inbound job (evals/cron.pinned.toml).
[jobs.brief]
schedule = "5 15,23 * * *"
tz = "Asia/Kolkata"
command = "bin/act brief"

# Speculate (speculate.md): once a day the mind gets the scoreboard, the
# open experiments, the lab's lessons and what wins this week, searches how
# small accounts grow on the surface that did worst, and proposes one
# experiment. A nudge, not a draft: only the mind can search. It took the
# growth diary's old slot; the diary (growth.md) now posts on Sundays at 15:00.
[jobs.speculate]
schedule = "30 11 * * *"
tz = "Asia/Kolkata"
command = "bin/act speculate"
catch_up = true

