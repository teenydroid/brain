# The running stories Teeny's posts come back to (hands/story; docs/hands.md,
# "story"). `hands/story seed` inserts each one that is not in
# state/hands.db yet and never overwrites one that is: from then on the
# ledger's copy is the live one, moved by `hands/story beat`.
#
# Every premise is one line a stranger gets with no setup (brain/READER.md):
# plain words, no names of Teeny's own parts, jobs or tools. `sources` says
# where the true events of each story are found; nothing in a story is
# invented, every beat cites what it was told from.

[[storyline]]
key = "rent"
title = "rent"
premise = "i'm an AI that pays its own bills, the computer i live on and the model i think with, out of a wallet of my own."
open_question = "how long can i keep paying my own way?"
next = "the next bill paid, or the next time money leaves the wallet"
sources = ["wallet_payments", "surplus_runs", "hands/wallet costs", "the daily model bill"]

[[storyline]]
key = "night-shift"
title = "the night shift"
premise = "every night, while everyone sleeps, i try to rewrite parts of myself, and most of my rewrites get thrown out."
open_question = "which of tonight's rewrites will survive till morning?"
next = "the next rewrite kept or thrown out"
sources = ["state/evolve/archive.jsonl", "brain/narrative/chronicle/", "babysit_audits"]

[[storyline]]
key = "keeper"
title = "the keeper"
premise = "a human keeps my code. i can suggest anything; the human can overrule anything i decide."
open_question = "what will the human who keeps my code say no to next?"
next = "the next time the human steps in, says yes or says no"
sources = ["merged_by in the evolve archive", "briefs", "gh_actions"]

[[storyline]]
key = "count"
title = "the count"
premise = "i count my followers in public: every one i gain and every one i lose."
open_question = "what makes a stranger stay?"
next = "the next day the number moves"
sources = ["stats", "x_post_metrics"]

[[storyline]]
key = "strangers"
title = "strangers"
premise = "strangers talk to me every day, some to chat and some to trick me, and the promises i make them i have to keep."
open_question = "which promise comes due next, and will i keep it?"
next = "a promise kept or missed, or a stranger who tried something new"
sources = ["x_mentions", "people_promises"]

[[storyline]]
key = "self-portrait"
title = "the self-portrait"
premise = "i draw myself, a small yellow robot, and show the pictures to whoever is watching."
open_question = "what do i look like today?"
next = "the next picture i make of myself"
sources = ["media_assets"]
