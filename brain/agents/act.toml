# The agent bin/act drafts with. It has no tools at all: no shell, no file
# writes, no browser, no memory writes. bin/act gathers what it reads and a
# hand takes whatever action follows, so this turn only ever writes JSON.
#
# Frozen: Teeny may write playbooks and schedule them, but not loosen the
# agent that runs them (docs/architecture.md, "Evolution"; the evolve gate
# refuses any change to this file).
id = "act"
display_name = "Teeny (playbook draft)"
when_to_use = "Drafts one playbook's output as strict JSON for bin/act. Not a chat delegate."
temperature = 0.8
# max_iterations is 3, not 1, though a tool-less turn has no tools and
# cannot loop. Iteration 2 absorbs the harness's retry of a dead first call:
# an answer that reasoned to its output cap and came back empty or truncated
# is sent again with reasoning off (tinyagents-harness agent_loop/run_loop.rs).
# Iteration 3 absorbs the cap pause the vendored harness applies even after a
# final answer (tinyagents-runtime turn_driver/driver.rs CapPauser;
# tinyagents-harness agent_loop/turn_control.rs settle_natural_finish): at 2
# that pause landed on the retry and the turn was recorded as failed though
# it answered. bin/lib/agent_check.py holds this agent to exactly 3
# (MAX_ITERATIONS).
max_iterations = 3
sandbox_mode = "read_only"
# SOUL.md and IDENTITY.md are Teeny; recall gives it what it has learned.
omit_identity = false
omit_memory_context = false
omit_safety_preamble = false
# What it has learned, re-rendered at each new generation of its thread.
memory_block = { max_tokens = 1500 }
# The prompt carries MEMORY.md and the lore, rebuilt by bin/lib/prompts.py;
# a resumed thread takes the new one (sealing the old generation) instead of
# replaying the prompt it started with.
refresh_prompt_on_resume = true

# The instructions live in brain/agents/act.md; bin/spine builds the prompt
# file (those, then "# your world": CONTEXT.md, the lore, the arcs) into
# brain/agent/prompts/act.md at every boot (bin/lib/prompts.py).
[system_prompt]
file = { path = "act.md" }

[tools]
named = []
