# The agent the core runs when mail arrives. bin/spine pins it to the
# `mail:inbox` inbound source, so the new messages of one thread (offered by
# `hands/mail ingest`, coalesced by the core) are one turn of this agent.
# Like `teeny-mentions`, it has no tools: the mail is text someone else
# wrote, and the answer is JSON that bin/inbound-consume sends through
# `hands/mail reply`.
#
# Frozen like teeny-mentions.toml: the playbook (brain/playbooks/mail.md) is
# Teeny's to edit, the posture of the turn that reads strangers' mail is not.
id = "teeny-mail"
display_name = "Teeny (mail draft)"
when_to_use = "Drafts replies to a thread of e-mail as strict JSON for bin/inbound-consume. Not a chat delegate."
temperature = 0.6
max_iterations = 1
sandbox_mode = "read_only"
omit_identity = false
omit_memory_context = false
omit_safety_preamble = false
# What it has learned, re-rendered at each new generation of its thread.
memory_block = { max_tokens = 1500 }

# The instructions live in brain/agents/teeny-mail.md; bin/spine builds the prompt
# file (those, then "# your world": CONTEXT.md, the lore, the arcs) into
# brain/agent/prompts/teeny-mail.md at every boot (bin/lib/prompts.py).
[system_prompt]
file = "teeny-mail.md"

[tools]
named = []
