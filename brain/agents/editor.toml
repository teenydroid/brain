# The agent bin/studio picks with: the studio's editor. It ranks a slot's
# finished posts and marks any that break the content list, and tags the
# feed's cards with the people in them. It is not Teeny (no identity, no
# memory) and has no tools at all; it never sees who wrote a post or why.
#
# Frozen like judge.toml (evals/frozen.txt): the evolve gate refuses any
# change to this file. Its model is STUDIO_EDITOR_MODEL, given per turn
# (bin/ask --model), so it can differ from the writer's.
id = "editor"
display_name = "Studio editor"
when_to_use = "Ranks studio posts and tags the feed, as strict JSON for bin/studio. Not a chat delegate."
# Low: the same posts should get the same ranking.
temperature = 0.3
# max_iterations is 2, not 1, though a tool-less turn is one model call and
# cannot loop: the vendored harness pauses a session turn at the cap even
# after a final answer, so at 1 every turn is recorded as failed (vendor
# tinyagents-runtime turn_driver/driver.rs CapPauser; tinyagents-harness
# agent_loop/turn_control.rs settle_natural_finish). bin/lib/agent_check.py
# holds this agent to exactly 2 (NO_TOOLS_MAX_ITERATIONS).
max_iterations = 2
sandbox_mode = "read_only"
omit_identity = true
omit_memory_context = true
# Nor logged: a turn of this agent never reaches the core's memory, where
# nobody would recall it and it would crowd the mind's recall (agent_check.py).
omit_memory_log = true
omit_safety_preamble = false
refresh_prompt_on_resume = true

# The instructions live in brain/agents/editor.md; bin/spine builds the prompt
# file (those, then narrative/STUDIO-EDITOR.md) into
# brain/agent/prompts/editor.md at every boot (bin/lib/prompts.py).
[system_prompt]
file = { path = "editor.md" }

[tools]
named = []
