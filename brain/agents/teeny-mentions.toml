# The agent the core runs when mentions arrive. bin/spine pins it to the
# `x:mentions` inbound source, so a batch of mentions (offered by
# `hands/x ingest`, coalesced by the core) is one turn of this agent. Like
# `act`, it has no tools: the mentions are text someone else wrote, and the
# answer is JSON that bin/inbound-consume sends through `hands/x reply`.
#
# Frozen like act.toml: the playbook (brain/playbooks/mentions.md) is Teeny's
# to edit, the posture of the turn that reads strangers' text is not.
id = "teeny-mentions"
display_name = "Teeny (mentions draft)"
when_to_use = "Drafts answers to a batch of X mentions as strict JSON for bin/inbound-consume. Not a chat delegate."
temperature = 0.8
# max_iterations is 2, not 1, though a tool-less turn is one model call and
# cannot loop: the vendored harness pauses a session turn at the cap even
# after a final answer, so at 1 every turn is recorded as failed (vendor
# tinyagents-runtime turn_driver/driver.rs CapPauser; tinyagents-harness
# agent_loop/turn_control.rs settle_natural_finish). The second iteration only
# absorbs that pause or an output-retry nudge. bin/lib/agent_check.py holds
# every drafting agent to exactly 2 (NO_TOOLS_MAX_ITERATIONS).
max_iterations = 2
sandbox_mode = "read_only"
omit_identity = false
omit_memory_context = false
omit_safety_preamble = false
# What it has learned, re-rendered at each new generation of its thread.
memory_block = { max_tokens = 1500 }
# The prompt carries MEMORY.md and the lore, rebuilt by bin/lib/prompts.py;
# a resumed thread takes the new one (sealing the old generation) instead of
# replaying the prompt it started with.
refresh_prompt_on_resume = true

# The instructions live in brain/agents/teeny-mentions.md; bin/spine builds the prompt
# file (those, then "# your world": CONTEXT.md, the lore, the arcs) into
# brain/agent/prompts/teeny-mentions.md at every boot (bin/lib/prompts.py).
[system_prompt]
file = { path = "teeny-mentions.md" }

[tools]
named = []
