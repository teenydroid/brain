# The agent bin/studio pitches and drafts with: Teeny's writer. It has no
# tools at all: no shell, no file writes, no browser, no memory writes.
# bin/studio gathers what it reads (hands/story desk and the outside world)
# and nothing it writes leaves the studio in this version (STUDIO_DRY).
#
# Frozen like act.toml (evals/frozen.txt): Teeny may change how it writes
# (writer.md, the skills), never the posture of the turn that reads strangers'
# text.
id = "writer"
display_name = "Teeny (studio writer)"
when_to_use = "Pitches and drafts pieces as strict JSON for bin/studio. Not a chat delegate."
# High: the room makes many and the editor picks, so the writer is asked for
# range, not for the safest line.
temperature = 1.0
# max_iterations is 2, not 1, though a tool-less turn is one model call and
# cannot loop: the vendored harness pauses a session turn at the cap even
# after a final answer, so at 1 every turn is recorded as failed (vendor
# tinyagents-runtime turn_driver/driver.rs CapPauser; tinyagents-harness
# agent_loop/turn_control.rs settle_natural_finish). bin/lib/agent_check.py
# holds every drafting agent to exactly 2 (NO_TOOLS_MAX_ITERATIONS).
max_iterations = 2
sandbox_mode = "read_only"
# SOUL.md and IDENTITY.md are Teeny's voice, so they stay in.
omit_identity = false
# No recall: every fact a draft may use is in the run's message, so nothing
# remembered can slip a fact in that the gates cannot trace (bin/lib/prompts.py).
omit_memory_context = true
omit_safety_preamble = false
refresh_prompt_on_resume = true

# The instructions live in brain/agents/writer.md; bin/spine builds the prompt
# file (those, then READER.md, the craft and the lore) into
# brain/agent/prompts/writer.md at every boot (bin/lib/prompts.py).
[system_prompt]
file = { path = "writer.md" }

[tools]
named = []
