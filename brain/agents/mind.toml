# The agentic mind (docs/mind.md): the agent the pinned `mind` cron job and
# any `agent = "mind"` job in brain/cron.toml runs. Unlike the five-minute
# tick (teeny.toml, tool-less), this one holds tools and decides its own
# steps: it has a shell, the file tools and its memory, and it works in its
# own home, state/home/.
#
# What keeps the two fences (docs/governance.md): it holds no key and no
# token. Its shell is jailed to state/home/ (below), its environment carries
# none of the core's or the hands' settings, and secrets/, hands/, bin/ and
# the live brain/ are outside the jail. Everything it does to the world goes
# through the broker (bin/broker), which calls the hands, so the guard, the
# caps and DRY_RUN apply to it exactly as to the tick. It has no tool that
# schedules a job: a cron shell job runs outside any jail, so its own wakes
# are agent jobs the broker creates (`teeny wake`). It may spawn one kind of
# helper, the worker (worker.toml), which is held the same way.
#
# Frozen like builder.toml: Teeny decides what the mind does (mind.md, its
# notes, its skills), never which tools or which folder it has. bin/doctor
# checks the posture (bin/lib/agent_check.py).
id = "mind"
display_name = "Teeny (mind)"
when_to_use = "Teeny's own standing work, on a schedule: its projects, its notes, its changes to itself. Not a chat delegate."
temperature = 0.7
# The mind runs on a stronger model than the scripts. On the scripts' own
# small model (SPINE_MODEL) its first two live wakes (2026-11-23) made 60 and
# 133 model calls, wrote nothing, and the second was stopped by the harness
# for repeating one step. A one-shot draft is within that model's reach; a
# half-hour session with tools is not. The scripts stay on the cheap model:
# that is the point of keeping them (docs/mind.md). The worker inherits
# this. bin/spine registers the model's window at boot
# (bin/lib/model_windows.sh); without one its turns go out empty.
# This line alone does not move the model: under bin/spine's fixed route the
# core takes an agent's model from its own config, so bin/spine writes this
# pin there as `[teams.mind]` (bin/lib/core_sections/automation.py,
# agent_models).
# On glm-5.3-flash (2026-11-27/28) my first wake decided its notes were
# missing and rewrote all seven core notes files as stubs, and a later wake
# repeated one exec call 20 times. The mind ran on claude-opus-5.5 from then.
# On 2026-11-28 I moved it to kimi-k3 as a trial: it calls tools properly
# through Surplus, has the same 1M window, and lists at under half Opus's
# price. Langfuse's surplus.charge generations show what each wake costs and
# how much of it is cache; if wakes go back to looping, this goes back to Opus.
model = "kimi-k3"
# A wake is a real working session: read the notes, do a piece of a project,
# write down where it stopped. A wake may fill 25 of the 30 minutes to the next
# one: the turn deadline (bin/lib/teeny.sh, 1500 s) is what ends a run that
# does not end itself, and this count is set above what that deadline lets
# through (a model call takes about 7 s on the box, so about 215 in 25 minutes). At
# 60 the first live wake (2026-11-23) was cut off after 7 minutes of reading,
# with nothing written. The harness records a run that reaches this count as
# failed, so it must not be the limit a normal wake meets.
max_iterations = 250
# The sandbox jails files, not the network (see builder.toml): the shell
# writes state/home/ and reads the system's own directories, and nothing
# else of the checkout. It has the host's network, which is how it reaches
# the broker on loopback and the open web.
sandbox_mode = "sandboxed"
sandbox_filesystem_only = true
scheduled_actions = true
scheduled_workspace = "state/home"
# Its browser is for reading. The core's one browser profile is signed in as
# Teeny, and the operator agent may click and type in it; with this the
# core gives this agent a throwaway profile and only the actions that open
# and read a page (OpenHuman, `browser_view_only`). bin/doctor requires it.
browser_view_only = true
# No SOUL.md from the core: it is the public voice, 18 KB of posting rules and
# tweet examples, and the mind paid for it on every one of up to 300 model
# calls a wake. Who Teeny is opens mind.md; the voice is library/SOUL.md, read
# before the mind writes for anyone (bin/lib/broker.py copies it in). This also
# drops the core's generic ROLE.md, which told the mind it was a "Master Agent".
omit_identity = true
omit_memory_context = false
omit_safety_preamble = false

memory_block = { max_tokens = 2000 }

# The core defaults agent_tier to "worker", a leaf that may not list subagents,
# and rejects the whole agent registry over one such definition. The mind is the
# coordinator, so it is a reasoning-tier agent; the worker stays the leaf.
agent_tier = "reasoning"

[system_prompt]
file = { path = "mind.md" }

[tools]
# Exactly these. Nothing that schedules, spends or connects: each of those
# is a way past the jail or the broker. The browser is view-only (above):
# anything that needs a click or a login still goes to the operator agent
# through `teeny do` queue_task.
named = [
    "shell",
    "file_read",
    "file_write",
    "edit",
    "glob",
    "grep",
    "list",
    "tool_search",
    "memory",
    # Reading pages that need a real browser to render (view-only).
    "browser",
    # Its helpers, and only the ones listed below ([subagents]).
    "spawn_subagent",
]

# The one agent the mind may spawn (worker.toml): a helper held to the same
# jail and the same broker. bin/doctor refuses any other name here.
[subagents]
allowlist = ["worker"]
