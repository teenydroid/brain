# The Cloudflare Tunnel for X's webhook (the `tunnel` service in
# deploy/compose.yaml, profile `tunnel`), on Teeny's own Cloudflare account.
# cloudflared dials out to Cloudflare, so nothing on the box takes a public
# port for it.
#
# A locally managed tunnel: this file is the routing, reviewed like any other
# change. The credentials JSON is the tunnel's secret and lives in
# secrets/cloudflared/creds.json, never here.
#
# The rules name no hostname: whatever public name the tunnel is given, the
# webhook is the same path on it, https://<name>/api/webhooks/x, and nothing
# else gets through. teeny.enamakel.com/api/webhooks/x keeps working through
# the host's nginx (deploy/nginx/teeny.enamakel.com.conf) for backwards
# compatibility.
#
# The tunnel sits on the compose network `edge` with xhook alone: it has no
# route to the spine, cortexdb, the Gateway or the core, and xhook verifies
# X's signature on every delivery. It cannot sit behind Cloudflare Access,
# because X cannot log in.
#
# bin/test/tunnel_test.sh holds these rules in place.
tunnel: teeny
credentials-file: /etc/cloudflared/creds.json
no-autoupdate: true

ingress:
  # X's Account Activity webhook. xhook answers this path as well as
  # /webhooks/x (hands/lib/teeny_hands/x/webhook.py, PATHS); its /health and
  # /queue are not reachable from here.
  - path: ^/api/webhooks/x$
    service: http://xhook:3110
  - service: http_status:404
