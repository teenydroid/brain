# Front-proxy vhost for the landing page, teeny.enamakel.com, and for the
# one agent route that lives on this name, /api/webhooks/x.
#
# nginx runs on the host. Installed as
# /etc/nginx/sites-available/teeny.enamakel.com.conf and symlinked into
# sites-enabled. The site itself is the `web` container in
# deploy/compose.yaml (profile `web`), published on 127.0.0.1:3120 (WEB_PORT).
#
# The domain is proxied by Cloudflare, which connects to this origin over
# HTTPS, so the 443 block is not optional: without a TLS server for this name
# nginx falls through to whichever one it has first and serves another
# project's site under this domain.
#
# Issuing the certificate is a chicken-and-egg: this file will not load until
# /etc/letsencrypt/live/teeny.enamakel.com exists, and certbot cannot answer
# the challenge until nginx serves the name. Install the port 80 block alone
# first, issue, then install the whole file. deploy/web-vhost.sh does exactly
# that, in order.
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d teeny.enamakel.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream teeny_web {
    server 127.0.0.1:3120;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name teeny.enamakel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name teeny.enamakel.com;

    ssl_certificate     /etc/letsencrypt/live/teeny.enamakel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teeny.enamakel.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # X's Account Activity webhook, registered on this name as
    # https://teeny.enamakel.com/api/webhooks/x since 2026-09-14. It is the
    # agent's route, not the site's: the spine's `xhook` service on
    # 127.0.0.1:3110 (deploy/compose.yaml, bin/x-webhook) answers it as
    # /webhooks/x. Signed by X and verified there,
    # and X retries a delivery it does not see acknowledged quickly, so
    # nothing here may buffer or slow the response down. Nothing else under
    # /api is routed to the agent; /health and /queue stay off the internet.
    location = /api/webhooks/x {
        proxy_pass http://127.0.0.1:3110/webhooks/x;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets: immutable, so let Cloudflare and browsers keep them.
    location /_next/static/ {
        proxy_pass http://teeny_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://teeny_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
