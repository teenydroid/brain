# Teeny's static sites (hands/deploy; docs/roadmap.md, A11): one subdomain per
# published build, https://<slug>.teeny.enamakel.com/, served straight from
# the folder hands/deploy writes (DEPLOY_ROOT, default <checkout>/state/sites;
# set `root` below to the host path of that folder).
#
# Files only. No proxy, no fastcgi, no interpreter of any kind: whatever a
# build puts in its folder is sent as bytes, never run. GET and HEAD only, no
# directory listings, no dotfiles, and a Content-Security-Policy that keeps a
# page to its own subdomain (no posting anywhere, no remote scripts), on top
# of hands/deploy's own refusal of forms and remote scripts.
#
# Not installed by default. It needs a wildcard certificate for
# *.teeny.enamakel.com, which certbot issues only by DNS challenge (the
# Cloudflare plugin, with a token scoped to that zone):
#
#   sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/cf.ini \
#        -d '*.teeny.enamakel.com'
#   sudo cp deploy/nginx/sites.teeny.enamakel.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/sites.teeny.enamakel.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then DEPLOY=1 in secrets/teeny.env.

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<site>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?)\.teeny\.enamakel\.com$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^(?<site>[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?)\.teeny\.enamakel\.com$;

    ssl_certificate     /etc/letsencrypt/live/teeny.enamakel.com-sites/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teeny.enamakel.com-sites/privkey.pem;

    root /srv/teeny/state/sites/$site;
    index index.html index.htm;
    autoindex off;
    disable_symlinks on;
    charset utf-8;
    client_max_body_size 0;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

# The paid endpoint (bin/paywall; docs/roadmap.md, S4): x402 is a reserved
# name no build can take (hands/deploy), and an exact name wins over the
# pattern above. The one place on these subdomains with code behind it: the
# `paywall` service, which sells one resource and signs nothing.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name x402.teeny.enamakel.com;

    ssl_certificate     /etc/letsencrypt/live/teeny.enamakel.com-sites/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teeny.enamakel.com-sites/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /stats {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:3130/stats;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-PAYMENT $http_x_payment;
    }

    location / {
        return 404;
    }
}
