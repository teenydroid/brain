# The `web` service (deploy/compose.yaml): teeny.enamakel.com's old landing
# page, now a permanent redirect to the same path on GitHub Pages, where the
# site lives (web/, .github/workflows/pages.yml). The Cloudflare Tunnel
# (deploy/cloudflared/config.yml) sends it every request except X's webhook.
server {
    listen 3000;
    server_name _;
    access_log off;

    location = /healthz {
        return 204;
    }

    location / {
        return 301 https://teenydroid.github.io$request_uri;
    }
}
