# The `web` service (deploy/compose.yaml), behind teeny.enamakel.com's host
# vhost (deploy/nginx/teeny.enamakel.com.conf) on 127.0.0.1:3120.
#
# The site lives at https://teenydroid.github.io now (web/, published by
# teenydroid/teenydroid.github.io's build.yml). The old address keeps its
# bare root, which every old post and profile links to, as a permanent
# redirect there. Every other path answers 404. X's webhook never reaches
# this container: the host vhost sends /api/webhooks/x to xhook first.
server {
    listen 3000;
    server_name _;
    access_log off;

    location = /healthz {
        return 204;
    }

    location = / {
        return 301 https://teenydroid.github.io/;
    }

    location / {
        return 404;
    }
}
