# The otel-collector between the Gateway and Langfuse (deploy/langfuse/README.md).
#
# The Gateway's diagnostics-otel exporter posts OTLP/HTTP here with no
# credential (core/src/gateway/otel.ts); this collector adds Langfuse's project
# key, which only it holds (secrets/langfuse-otlp.env, LANGFUSE_OTLP_AUTH =
# base64 of "public:secret"), and forwards to Langfuse's OTLP endpoint. Both
# sit on the private langfuse-net; nothing here listens on the host.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Drops the core's RPC chatter with the Gateway (cron, settings, health:
  # openclaw.gateway.rpc.* and openclaw.diagnostic.phase spans), which on the
  # live test made 9 traces in 10. Span by span, not trace by trace: a turn
  # can start under the RPC span that asked for it, and a trace-level sampler
  # would judge it on that span alone and then drop the run and model spans
  # that arrive after its decision. Here every agent span lands whenever it
  # arrives; in Langfuse a run whose RPC parent was dropped sits at the root.
  filter/rpc-chatter:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(name, "^openclaw\\.(gateway\\.rpc\\.|diagnostic\\.phase$)")'
        # The run's usage total, a second generation per run: Langfuse would add its tokens to the calls' own.
        - 'name == "openclaw.model.usage"'
  # Tokens and money come from one place: the core's model meter (core/src/gateway/meter.ts), which writes a
  # surplus.charge generation per call with Surplus's own counts and its actual charge. The Gateway's model-call span
  # keeps the prompt, the reply and its timings, but loses its gen_ai.usage.* figures, which Langfuse would count a
  # second time. (Its openclaw.model_call.usage.* attributes stay, as metadata Langfuse does not add up.)
  transform/usage-from-the-bill:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - 'name == "openclaw.model.call"'
        statements:
          - 'delete_matching_keys(attributes, "^gen_ai\\.usage\\.")'
  batch:
    send_batch_size: 512
    timeout: 5s

exporters:
  otlp_http/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_OTLP_AUTH}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 10m
    sending_queue:
      enabled: true
      queue_size: 5000

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    # Langfuse takes traces only; the Gateway sends nothing else (metrics and
    # logs are off in its config).
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/rpc-chatter, transform/usage-from-the-bill, batch]
      exporters: [otlp_http/langfuse]
