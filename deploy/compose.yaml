# The spine: teeny-spine (a stock OpenHuman core, built here) over this
# checkout (docs/architecture.md).
#
# Its own compose project, so it runs beside whatever else is on the box. It
# publishes no port; operators reach it with `exec`.
#
#   git submodule update --init --recursive vendor/openhuman
#   cp deploy/spine.env.example secrets/spine.env      # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml exec spine bin/crons
#   docker compose -f deploy/compose.yaml exec spine bin/ask "hello"
#   deploy/tell.sh "tweet that the paywall is live"   # a beat, now, on your word

name: teeny-spine

services:
  spine:
    image: teeny-spine:current
    build:
      context: ..
    restart: unless-stopped
    init: true
    # The checkout owner's uid, so what the core writes (brain/storage.db,
    # state/, secrets/, .openhuman/) belongs to whoever pulls and backs it up.
    user: "${TEENY_UID:-1000}:${TEENY_GID:-1000}"
    environment:
      # A non-passwd uid has no home; the core wants one.
      HOME: /tmp
      CALENDAR_TZ: ${CALENDAR_TZ:-UTC}
    # The spine lives in CortexDB's network namespace, so it reaches its
    # memory at http://127.0.0.1:3141 (CORTEX_API_URL in secrets/spine.env):
    # the core sends a credential over plain http only to a loopback address,
    # and CortexDB binds loopback only, so nothing else on the compose
    # network can reach it. The two share /etc/hosts too, so the ladder's
    # host entry is on the cortexdb service. Recreate the spine whenever
    # cortexdb is recreated (`up -d` does; a bare `docker restart cortexdb`
    # leaves the spine without a network).
    network_mode: "service:cortexdb"
    depends_on:
      cortexdb:
        condition: service_healthy
        required: false
    volumes:
      - ..:/srv/teeny
    # Chromium (the browser operator) wants more shared memory than Docker's
    # 64 MB default. Its profile and downloads live in state/browser/, in
    # the mounted checkout, so a logged-in session survives a restart.
    shm_size: 1gb

  # Teeny's long-term memory: the core's memory engine (bin/spine points it
  # here with `memory_engine_set` when secrets/spine.env has CORTEX_API_URL).
  # Its own store in the cortexdb-data volume; no published port, only the
  # spine talks to it. Its models are Surplus Intelligence's (one account,
  # one key: SURPLUS_API_KEY), written into secrets/cortex.env with the
  # model keys (deploy/cortex.env.example says how).
  #
  # Two model tiers. Writing (CORTEX_LLM_*, CORTEX_ENRICHMENT_*: turning new
  # memories into facts, in the background) is most of the tokens and nobody
  # waits on it, so it runs on glm-5.3-flash, the cheapest model that keeps
  # CortexDB's strict JSON (16/16 on a strict json_schema probe, 2026-11-14;
  # about 44% cheaper a call than gpt-6-luna once its reasoning tokens are
  # counted, but ~15s a call). Reading (CORTEX_ANSWER_*, CORTEX_VERIFIER_*:
  # recall, which a tick waits on) stays on gpt-6-luna (~3s). Override either
  # tier with CORTEX_WRITE_MODEL / CORTEX_READ_MODEL; CORTEX_MODEL, if set,
  # still sets both, as it did before.
  #
  # The embedding pair (model and dims) is pinned on the first memory and
  # cannot change after it without re-embedding everything stored.
  cortexdb:
    image: cortexdb/cortexdb:v0.10.4
    restart: unless-stopped
    env_file:
      - path: ../secrets/cortex.env
        required: false
    environment:
      # Loopback only, inside the namespace it shares with the spine (above):
      # no other container reaches it, so it needs no key of its own.
      CORTEX_V1_API_ADDR: 127.0.0.1:3141
      CORTEX_INSECURE_NO_AUTH: "1"
      CORTEX_CHANNEL: docker
      CORTEX_LLM_URL: https://api.surplusintelligence.ai/v1
      CORTEX_LLM_MODEL: ${CORTEX_WRITE_MODEL:-${CORTEX_MODEL:-glm-5.3-flash}}
      CORTEX_ENRICHMENT_URL: https://api.surplusintelligence.ai/v1
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_WRITE_MODEL:-${CORTEX_MODEL:-glm-5.3-flash}}
      CORTEX_ENRICHMENT_DELAY_SECONDS: "0"
      CORTEX_ANSWER_URL: https://api.surplusintelligence.ai/v1
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_MODEL: ${CORTEX_READ_MODEL:-${CORTEX_MODEL:-gpt-6-luna}}
      CORTEX_VERIFIER_URL: https://api.surplusintelligence.ai/v1
      CORTEX_VERIFIER_MODEL: ${CORTEX_READ_MODEL:-${CORTEX_MODEL:-gpt-6-luna}}
      CORTEX_EMBEDDING_URL: https://api.surplusintelligence.ai/v1
      CORTEX_EMBEDDING_MODEL: venice-embed-1
      CORTEX_EMBEDDING_DIMS: "1024"
      CORTEX_EMBEDDING_HTTP_TIMEOUT_SECS: "30"
      CORTEX_LLM_MAX_IN_FLIGHT: "16"
      CORTEX_V1_LAYERS_AUTO: "1"
      CORTEX_FACT_VALIDITY_FILTER: "1"
      RUST_LOG: cortexdb=info,cortex_api=info,cortex_embedding=warn
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3141/v1/admin/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    # The spine's host entries live here: it shares this namespace.
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
    volumes:
      - cortexdb-data:/data

  # X's webhook (bin/x-webhook): mentions, replies and quotes pushed by X as
  # they happen, so nothing is searched or billed per post. The vhost routes
  # https://teeny.enamakel.com/api/webhooks/x to 127.0.0.1:3110/webhooks/x.
  # Same image and checkout as the spine; it only writes x_mentions in
  # state/hands.db. It screens nothing: it has its own network namespace, so
  # the core on 127.0.0.1:7788 (and with it the safety judge) is out of its
  # reach. It queues each mention `unscreened`, and bin/mentions, in the
  # spine, screens it with the guard before offering it.
  xhook:
    image: teeny-spine:current
    restart: unless-stopped
    init: true
    user: "${TEENY_UID:-1000}:${TEENY_GID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: ["/srv/teeny/bin/x-webhook"]
    # Its own check: the image's default one asks the core on 7788, which
    # this container does not run.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3110/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${XHOOK_PORT:-3110}:3110"
    volumes:
      - ..:/srv/teeny

  # Teeny's paid endpoint (bin/paywall; docs/roadmap.md, S4): one x402-priced
  # resource, its latest public stats, at https://x402.teeny.enamakel.com/stats
  # (nginx/sites.teeny.enamakel.com.conf proxies to 127.0.0.1:3130). Same
  # image and checkout as the spine; it signs nothing and pays nothing, and
  # writes only x402_sales and the inflow ledger in state/hands.db. Behind a
  # profile, and 404 until X402_ENDPOINT=1: `--profile paywall up -d`.
  paywall:
    profiles: [paywall]
    image: teeny-spine:current
    restart: unless-stopped
    init: true
    user: "${TEENY_UID:-1000}:${TEENY_GID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: ["/srv/teeny/bin/paywall"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3130/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${PAYWALL_PORT:-3130}:3130"
    volumes:
      - ..:/srv/teeny

  # The hand-test sandbox (docs/evolve.md, "The hand-test sandbox"): where
  # bin/evolve runs a candidate's hand tests, code a model wrote, since the
  # spine's container has no user namespaces for bubblewrap. Same image, no
  # network at all, a read-only root, no new privileges, and nothing of the
  # checkout mounted but state/sandbox/ (the jobs bin/evolve leaves and the
  # results bin/sandbox-runner writes back) and the runner's two frozen
  # files, read-only. No secrets/, no state/ beyond that, no .git.
  #
  # The runner starts as root with only SETUID, SETGID, CHOWN and KILL. It
  # touches state/sandbox/ (kept 0700) only as the checkout's owner, and
  # runs each job's tests as SANDBOX_TEST_UID (nobody), on a copy in the
  # /work tmpfs: they can reach neither state/sandbox/ nor the runner, so
  # they cannot forge a result, signal the runner or read its memory. At its
  # time limit a job's process group is killed, and after every job each
  # process of the test uid. Create state/sandbox/ as the checkout's owner
  # before the first `up` (`mkdir -p state/sandbox`), or Docker makes it
  # root's and the runner cannot answer (bin/doctor warns; hand edits are
  # deferred, never shipped).
  sandbox:
    image: teeny-spine:current
    restart: unless-stopped
    init: true
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 2g
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /work:size=2g,mode=1777,exec
    environment:
      HOME: /tmp
      SANDBOX_UID: ${TEENY_UID:-1000}
      SANDBOX_GID: ${TEENY_GID:-1000}
      SANDBOX_TEST_UID: "65534"
      SANDBOX_TEST_GID: "65534"
    entrypoint: ["python3", "-I", "/opt/sandbox/sandbox-runner", "/sandbox", "/work"]
    # Not the image's HEALTHCHECK (curl to the core on :7788, which never
    # runs here): the runner's heartbeat, /sandbox/ready, touched every 10 s
    # and stale after 60 s. The check drops to SANDBOX_UID to read it, since
    # this root cannot pass state/sandbox/'s 0700.
    healthcheck:
      test: ["CMD", "python3", "-I", "/opt/sandbox/sandbox.py", "health", "/sandbox"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ../state/sandbox:/sandbox
      - ../bin/sandbox-runner:/opt/sandbox/sandbox-runner:ro
      - ../bin/lib/sandbox.py:/opt/sandbox/sandbox.py:ro

  # Clips with Teeny's voice and captions, and songs (hands/reel; docs/hands.md,
  # "reel"): MoneyPrinterTurbo, the upstream repo itself at
  # vendor/moneyprinter (a release tag, never edited here), built API-only by
  # deploy/reel.Dockerfile and run behind Teeny's front, deploy/reel/serve.py,
  # which takes one job route and refuses every other upstream route. Config
  # is deploy/reel.config.toml: no stock footage, no model, no upload service,
  # Edge captions. Teeny's media is mounted read-only (state/media/ and
  # brain/assets/); jobs and renders live in the reel-storage volume until
  # hands/reel copies the mp4 into state/media/ and deletes the task. No
  # published port: the spine reaches it at http://reel:8080 (REEL_URL) on the
  # compose network. Behind a profile, like web:
  #   git submodule update --init vendor/moneyprinter
  #   docker compose -f deploy/compose.yaml --profile reel up -d --build reel
  # A render takes about 3 cores and 2.4 GB (one 12 s clip, 2026-11-18); one
  # at a time (max_concurrent_tasks = 1 in its config), capped below.
  reel:
    profiles: [reel]
    image: teeny-reel:current
    build:
      context: ../vendor/moneyprinter
      dockerfile: ../../deploy/reel.Dockerfile
      additional_contexts:
        teeny: ./reel
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 4
    mem_limit: 4g
    pids_limit: 512
    environment:
      # The image's user has no writable home; caches go to the tmpfs.
      HOME: /tmp
    volumes:
      - reel-storage:/MoneyPrinterTurbo/storage
      - ./reel.config.toml:/MoneyPrinterTurbo/config.toml:ro
      - ../state/media:/teeny/media:ro
      - ../brain/assets:/teeny/assets:ro

  # Known meme templates for hands/meme template (docs/hands.md, "meme"):
  # memegen, the upstream repo itself at vendor/memegen (a pinned commit:
  # upstream tags no releases; never edited here), built by its own
  # Containerfile as it is. What runs is Teeny's front, deploy/memegen/front.py
  # (mounted read-only at /opt/teeny), in place of upstream's app.main: the
  # same app, but an overlay or background is copied from Teeny's art (state/
  # media/ and brain/assets/, mounted read-only) for an http://teeny-art/...
  # address and every other URL is refused, so it fetches nothing from the
  # internet; no "Memegen.link" watermark; tracking and search are no-ops.
  # REMOTE_TRACKING_URL and BUGSNAG_API_KEY stay unset (upstream's only other
  # outbound calls). It writes only inside its own container (its template
  # folders cache each pasted picture, images/ each render), so it is not
  # read_only; a recreate starts it clean. No published port: the spine
  # reaches it at http://memegen:5000 (MEMEGEN_URL) on the compose network.
  # Behind a profile, like reel:
  #   git submodule update --init vendor/memegen
  #   docker compose -f deploy/compose.yaml --profile memegen up -d --build memegen
  # Idle it holds about 120 MB; a render takes well under a second of one
  # core (2026-11-18, the pinned commit). Capped below.
  memegen:
    profiles: [memegen]
    image: teeny-memegen:current
    build:
      context: ../vendor/memegen
      dockerfile: Containerfile
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    environment:
      TEENY_ART_ROOT: /teeny
    # Upstream's own command (its Containerfile's entrypoint) with the front
    # as the app.
    entrypoint: ["poetry", "run", "gunicorn", "--bind", "0.0.0.0:5000",
                 "--worker-class", "uvicorn.workers.UvicornWorker", "--timeout", "20",
                 "--pythonpath", "/opt/teeny", "front:app"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:5000/templates/drake"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./memegen:/opt/teeny:ro
      - ../state/media:/teeny/media:ro
      - ../brain/assets:/teeny/assets:ro

  # Short videos to study for hands/remake (docs/hands.md, "remake"): a pinned
  # yt-dlp and ffmpeg behind Teeny's own small service, deploy/ingest/serve.py
  # (built by deploy/ingest.Dockerfile). It lists an account's recent videos,
  # fetches an excerpt of one (YouTube, TikTok or Instagram addresses only;
  # deploy/ingest/policy.py is the allowlist) and cuts it into shots and
  # frames, and answers over HTTP until hands/remake deletes the fetch (a
  # sweep removes any it forgot after an hour). It holds no key and mounts
  # nothing of Teeny's: its one optional setting is INGEST_PROXY_URL, in
  # secrets/ingest.env (deploy/ingest.env.example), because YouTube refuses
  # this box's address without a proxy. Read-only root; fetches live in the
  # ingest-storage volume. No published port: the spine reaches it at
  # http://ingest:8090 (INGEST_URL) on the compose network. Behind a profile,
  # like reel:
  #   docker compose -f deploy/compose.yaml --profile ingest up -d --build ingest
  # One job at a time; a fetch takes a minute or two and about two cores.
  ingest:
    profiles: [ingest]
    image: teeny-ingest:current
    build:
      context: ./ingest
      dockerfile: ../ingest.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    env_file:
      - path: ../secrets/ingest.env
        required: false
    environment:
      # The image's user has no home; yt-dlp's scratch goes to the tmpfs.
      HOME: /tmp
    volumes:
      - ingest-storage:/data

  # The landing page at teeny.enamakel.com (nginx/teeny.enamakel.com.conf
  # proxies to 127.0.0.1:3120). Behind a profile: the old stack's web
  # container still holds that port on the box, so a plain `up` must not try
  # to take it. `--profile web up -d` once that container is gone. Every
  # number on the page is read from GitHub (teenydroid/brain, and the
  # receipts, stats snapshot and wallet address in teenydroid/diary) or, for
  # the wallet's balance, a public Solana RPC (SOLANA_RPC_URL, default the
  # public mainnet endpoint); there is no sample data, and MIND_API_URL (the
  # old runtime's token ledger) is unset, so the token widgets stay out.
  web:
    profiles: [web]
    image: teeny-web:current
    build:
      context: ../web
      args:
        # /rewards reads Solana from the browser; baked in at build time.
        NEXT_PUBLIC_SOLANA_RPC: ${NEXT_PUBLIC_SOLANA_RPC:-}
        NEXT_PUBLIC_SOLANA_RPC_DEVNET: ${NEXT_PUBLIC_SOLANA_RPC_DEVNET:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3120}:3000"

volumes:
  cortexdb-data:
  reel-storage:
  ingest-storage:
