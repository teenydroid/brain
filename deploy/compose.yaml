# The spine: teeny-spine (a stock OpenHuman core, built here) over this
# checkout (docs/architecture.md).
#
# Its own compose project, so it runs beside whatever else is on the box. It
# publishes no port; operators reach it with `exec`.
#
#   git submodule update --init --recursive vendor/openhuman
#   cp deploy/spine.env.example secrets/spine.env      # then fill it in
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml exec spine bin/crons
#   docker compose -f deploy/compose.yaml exec spine bin/ask "hello"

name: teeny-spine

services:
  spine:
    image: teeny-spine:current
    build:
      context: ..
    restart: unless-stopped
    init: true
    # The checkout owner's uid, so what the core writes (brain/storage.db,
    # state/, secrets/, .openhuman/) belongs to whoever pulls and backs it up.
    user: "${TEENY_UID:-1000}:${TEENY_GID:-1000}"
    environment:
      # A non-passwd uid has no home; the core wants one.
      HOME: /tmp
      CALENDAR_TZ: ${CALENDAR_TZ:-UTC}
    # The spine lives in CortexDB's network namespace, so it reaches its
    # memory at http://127.0.0.1:3141 (CORTEX_API_URL in secrets/spine.env):
    # the core sends a credential over plain http only to a loopback address,
    # and CortexDB binds loopback only, so nothing else on the compose
    # network can reach it. The two share /etc/hosts too, so the ladder's
    # host entry is on the cortexdb service. Recreate the spine whenever
    # cortexdb is recreated (`up -d` does; a bare `docker restart cortexdb`
    # leaves the spine without a network).
    network_mode: "service:cortexdb"
    depends_on:
      cortexdb:
        condition: service_healthy
        required: false
    volumes:
      - ..:/srv/teeny
    # The builder's shell runs in TinyBox's bubblewrap jail, which needs an
    # unprivileged user namespace. Under Docker's defaults the only jail left
    # is Landlock, which TinySecurity will not plan a shell onto
    # (denial=Unsupported), so the builder could run nothing. Three defaults
    # block bubblewrap, and these undo exactly those, for this service only:
    # - seccomp-spine.json is Docker's default profile plus one rule:
    #   clone, unshare, mount, umount2 and pivot_root, which Docker reserves
    #   for CAP_SYS_ADMIN. The spine holds no capabilities, so they act only
    #   inside a namespace the process created itself.
    # - apparmor=unconfined: docker-default has `deny mount`, which also stops
    #   mounts inside a fresh user namespace.
    # - systempaths=unconfined: Docker masks parts of /proc, and the kernel
    #   refuses a new proc mount (the jail's own PID namespace) while any of
    #   /proc is covered.
    # The cost: every process in the spine (the core, cron shell jobs, the
    # browser) can create user namespaces, and with them reach kernel code
    # that unprivileged users otherwise cannot, the usual route of kernel
    # privilege escalations. The host already allows that to its own users
    # (apparmor_restrict_unprivileged_userns=0). Still uid 1000, no
    # capabilities, not privileged. bin/test/compose_sandbox_test.sh pins it.
    security_opt:
      - seccomp=seccomp-spine.json
      - apparmor=unconfined
      - systempaths=unconfined
    # Chromium (the browser operator) wants more shared memory than Docker's
    # 64 MB default. Its profile and downloads live in state/browser/, in
    # the mounted checkout, so a logged-in session survives a restart.
    shm_size: 1gb

  # Teeny's long-term memory: the core's memory engine (bin/spine points it
  # here with `memory_engine_set` when secrets/spine.env has CORTEX_API_URL).
  # Its own store in the cortexdb-data volume; no published port, only the
  # spine talks to it. Its models are Surplus Intelligence's (one account,
  # one key: SURPLUS_API_KEY), written into secrets/cortex.env with the
  # model keys (deploy/cortex.env.example says how).
  #
  # The embedding pair (model and dims) is pinned on the first memory and
  # cannot change after it without re-embedding everything stored.
  cortexdb:
    image: cortexdb/cortexdb:v0.10.4
    restart: unless-stopped
    env_file:
      - path: ../secrets/cortex.env
        required: false
    environment:
      # Loopback only, inside the namespace it shares with the spine (above):
      # no other container reaches it, so it needs no key of its own.
      CORTEX_V1_API_ADDR: 127.0.0.1:3141
      CORTEX_INSECURE_NO_AUTH: "1"
      CORTEX_CHANNEL: docker
      CORTEX_LLM_URL: https://api.surplusintelligence.ai/v1
      CORTEX_LLM_MODEL: ${CORTEX_MODEL:-gpt-6-luna}
      CORTEX_ENRICHMENT_URL: https://api.surplusintelligence.ai/v1
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_MODEL:-gpt-6-luna}
      CORTEX_ENRICHMENT_DELAY_SECONDS: "0"
      CORTEX_ANSWER_URL: https://api.surplusintelligence.ai/v1
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_MODEL: ${CORTEX_MODEL:-gpt-6-luna}
      CORTEX_VERIFIER_URL: https://api.surplusintelligence.ai/v1
      CORTEX_VERIFIER_MODEL: ${CORTEX_MODEL:-gpt-6-luna}
      CORTEX_EMBEDDING_URL: https://api.surplusintelligence.ai/v1
      CORTEX_EMBEDDING_MODEL: venice-embed-1
      CORTEX_EMBEDDING_DIMS: "1024"
      CORTEX_EMBEDDING_HTTP_TIMEOUT_SECS: "30"
      CORTEX_LLM_MAX_IN_FLIGHT: "16"
      CORTEX_V1_LAYERS_AUTO: "1"
      CORTEX_FACT_VALIDITY_FILTER: "1"
      RUST_LOG: cortexdb=info,cortex_api=info,cortex_embedding=warn
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3141/v1/admin/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    # The spine's host entries live here: it shares this namespace.
    extra_hosts:
      - "${LADDER:-ladder}:host-gateway"
    volumes:
      - cortexdb-data:/data

  # X's webhook (bin/x-webhook): mentions, replies and quotes pushed by X as
  # they happen, so nothing is searched or billed per post. The vhost routes
  # https://teeny.enamakel.com/api/webhooks/x to 127.0.0.1:3110/webhooks/x.
  # Same image and checkout as the spine; it only writes x_mentions in
  # state/hands.db, and bin/mentions offers what it queued.
  xhook:
    image: teeny-spine:current
    restart: unless-stopped
    init: true
    user: "${TEENY_UID:-1000}:${TEENY_GID:-1000}"
    environment:
      HOME: /tmp
    entrypoint: ["/srv/teeny/bin/x-webhook"]
    # Its own check: the image's default one asks the core on 7788, which
    # this container does not run.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3110/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${XHOOK_PORT:-3110}:3110"
    volumes:
      - ..:/srv/teeny

  # The landing page at teeny.enamakel.com (nginx/teeny.enamakel.com.conf
  # proxies to 127.0.0.1:3120). Behind a profile: the old stack's web
  # container still holds that port on the box, so a plain `up` must not try
  # to take it. `--profile web up -d` once that container is gone. Every
  # number on the page is read from GitHub (teenydroid/brain, and the
  # receipts, stats snapshot and wallet address in teenydroid/diary) or, for
  # the wallet's balance, a public Solana RPC (SOLANA_RPC_URL, default the
  # public mainnet endpoint); there is no sample data, and MIND_API_URL (the
  # old runtime's token ledger) is unset, so the token widgets stay out.
  web:
    profiles: [web]
    image: teeny-web:current
    build:
      context: ../web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3120}:3000"

volumes:
  cortexdb-data:
