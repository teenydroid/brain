[package]
name = "teeny-spine"
description = "Teeny's spine: OpenHuman's command-line host, built from the library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "teeny-spine"
path = "src/main.rs"

[dependencies]
# The same host `openhuman-cli` builds (`openhuman-core` there), with its
# product feature set minus `os-keyring`: the spine keeps secrets in the file
# store under a master key file, never an OS keychain, which a container does
# not have (docs/architecture.md, "Keyring"). Desktop-only features (voice,
# whatsapp-web) stay off. `inbound-queues` is the durable event intake X
# mentions are offered to (`openhuman.inbound_offer`). `web3` is the wallet
# domain (`[wallet_policy]`, the wallet tools) that the tinywallet module
# serves.
openhuman-rpc = { path = "../vendor/openhuman/crates/openhuman-rpc", default-features = false, features = [
    "http-client",
    "server",
    "http-server",
    "media",
    "skills",
    "flows",
    "mcp",
    "channels",
    "scheduler-gate",
    "file-logging",
    "modules",
    "jev",
    "web3",
    # Upstream's product set has it, and at this pin the core does not
    # compile without it (`modules::tinyflows` names its flow-scope import).
    "legacy-import",
    # The encrypted file keyring (OPENHUMAN_KEYRING_BACKEND=file) the spine
    # keeps every secret in; since this pin it is its own gate, and without it
    # the file backend fails closed at the first secret.
    "secret-file",
    # TinySecurity, which since this pin decides every path a file tool may
    # touch (`workspace_only`, the forbidden paths, the workbench grant) and
    # encrypts what the keyring stores. Without it those fail closed with
    # "not built into this host".
    "security-module",
    "storage-sqlite",
    "inbound-queues",
] }
# The modules compiled into the spine's own executable: TinyComputer (the
# `browser` tool) and tinywallet (the `web3` domain). Linked, a module is the
# exact `vendor/openhuman` gitlink the core was built against (no contract
# mismatch, no download at boot), and tinywallet's confidential calls reach it
# attested as host code. Only tinywallet is served linked:
# `bin/lib/core_sections/automation.py` sets `[modules] overrides` to
# `source = "linked"` for it alone. TinyComputer stays compiled in but loads
# from its pinned release, because the browser binds a host callback to it and
# TinyBus refuses a callback-bound load from a linked source ("callback source
# cannot preserve admitted identity"). Every other module loads from its
# pinned, digest-checked release.
openhuman-modules-linked = { path = "../vendor/openhuman/crates/openhuman-modules-linked", default-features = false, features = [
    "tinycomputer",
    "tinywallet",
] }
libc = "0.2"
# `wallet_backend.rs`, `lifi.rs`, `debridge.rs`: the wallet-backend hook (`__host::wallet_backend`, behind
# embed's `web3`) and the HTTP client for LI.FI's and deBridge's public APIs. Every feature
# named is one the core already turns on, so neither adds a crate.
openhuman-embed = { path = "../vendor/openhuman/crates/openhuman-embed", default-features = false, features = ["web3"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
log = "0.4"
# `lifi.rs`: a LI.FI Solana transaction comes as base64 and the wallet module
# signs hex. Both crates are already in the core's graph.
base64 = "0.22"
hex = "0.4"
