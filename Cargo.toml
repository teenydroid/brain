# Teeny's one Rust package: the spine binary, OpenHuman's command-line host
# built from the library (docs/architecture.md, "Spine"). Everything else
# Teeny is lives in brain/, hands/ and bin/.
#
# OpenHuman is the git submodule at vendor/openhuman, pinned at a commit on
# upstream tinyhumansai/openhuman main. `[patch]` is only honoured at a
# workspace root, and OpenHuman's own tables are ignored when it is a path
# dependency, so they are copied below with every path rebased onto
# vendor/openhuman/. Re-copy them on every bump of the submodule (a stale entry
# fails `cargo metadata` outright); Cargo.lock started as OpenHuman's own.
#
# Except the entries the spine's graph never uses (tinyagents-live,
# tinychannels, tinyflows, tinystoragedrivers-mongodb and -s3 at this pin): Cargo records
# an unused patch in Cargo.lock in an order that differs between macOS and
# Linux, so the image's `--locked` build fails on a lock written on a Mac.
# Drop any entry `cargo metadata` warns "was not used in the crate graph".
[workspace]
resolver = "2"
members = ["spine"]
exclude = ["vendor", "web", "worktrees"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[patch."https://github.com/tinyhumansai/tinytools"]
tinytools = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools" }
tinytools-agent = { path = "vendor/openhuman/vendor/tinyagents/vendor/tinytools/crates/tinytools-agent" }

[patch."https://github.com/tinyhumansai/tinybus"]
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/senamakel/tinybus"]
tinybus = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus" }
tinybus-macros = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-macros" }
tinybus-module = { path = "vendor/openhuman/vendor/tinybus/crates/tinybus-module" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
tinystoragedrivers = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
tinystoragedrivers-types = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-types" }

[patch."https://github.com/senamakel/tinystoragedrivers"]
tinystoragedrivers = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers" }
tinystoragedrivers-api = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-api" }
tinystoragedrivers-blob = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-blob" }
tinystoragedrivers-bus = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-bus" }
tinystoragedrivers-busproxy = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-busproxy" }
tinystoragedrivers-connect = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-connect" }
tinystoragedrivers-document = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-document" }
tinystoragedrivers-kv = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-kv" }
tinystoragedrivers-queue = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-queue" }
tinystoragedrivers-secrets = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-secrets" }
tinystoragedrivers-testkit = { path = "vendor/openhuman/vendor/tinystoragedrivers/crates/tinystoragedrivers-testkit" }
