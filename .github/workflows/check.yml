# Lint, test and build on every pull request.
#
# - spine: build the image (the TypeScript core and OpenClaw in a node:24
#   stage, a node:24 runtime), then boot it through bin/spine in a container
#   with a stub model and run the whole live test: seeding, a shell job,
#   bin/crons, bin/oh, bin/ask, the Gateway's lockdown and audit, a restart.
# - scripts: shellcheck over bin/ and the reconciliation tests (scripts-shell,
#   and doctor for bin/test/doctor_test.sh), and the hands' unit tests on
#   Python 3.11 (the image's version) in four shards (hands); `scripts` itself
#   passes only when all of them did. None needs a core.
# - core: the OpenClaw-backed core in core/ (tsc, eslint, vitest on Node 24);
#   `scripts` passes only when it did too.
# - web: the Next.js site (lint, tests, the static export).
# - frozen: on Teeny's own pull requests only (opened by teenydroid, or from
#   any teeny/ branch, whoever opened it: a generation's teeny/gen-<n>, a
#   revert's teeny/revert-gen-<n>, a self job's teeny/<slug>), refuse any
#   change to a path in evals/frozen.txt
#   (docs/evolve.md, "What Teeny may change"). The operator's PRs skip it.
#
# Nothing here deploys the stack: the box runs deploy/compose.yaml by hand
# (deploy/README.md). The site is the exception: pages.yml publishes web/ to
# GitHub Pages on merge.

name: check

on:
  pull_request:
  workflow_call:

jobs:
  spine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # The Dockerfile's shape: the node:24 core stage, the node:24 runtime and
      # its tools, every COPY inside the build context.
      - run: bin/test/dockerfile_test.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: teeny-spine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The live test runs inside the image (Node 24, the built core, Chromium),
      # over a scratch copy of this checkout, as the runner's own user.
      - name: bin/test/spine_live_test.sh in the image
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e TMPDIR=/tmp
          -v "$PWD":/srv/teeny --entrypoint bash teeny-spine:ci
          /srv/teeny/bin/test/spine_live_test.sh

  # The shell side of the old scripts job: shellcheck and the bin/ tests, but
  # the doctor's (doctor, below).
  scripts-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # The hands and bin/lib/*.py: Python 3.11's standard library, plus
      # `cryptography` for hands/keychain (python3-cryptography in the image).
      # The tests fake X and the core; nothing leaves the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --quiet "cryptography>=38" "pyyaml>=6"
      # shellcheck and sqlite3 ship on the runner image.
      - run: shellcheck -x bin/oh bin/ask bin/act bin/doctor bin/eval bin/crons bin/heartbeat bin/spine bin/seed-cron bin/frozen-check bin/evolve bin/evolve-gate bin/wants bin/inbound-consume bin/mentions bin/mail bin/stats-snapshot bin/moltbook-prune bin/tasks-desk bin/keychain-fill bin/bounty-pay bin/tick bin/reflect bin/dream bin/health bin/gh-inbound bin/proofs bin/accounts bin/wallet-watch bin/x402-fund bin/surplus-sweep bin/paid-requests bin/pay-bills bin/audit bin/autonomy bin/guard-review bin/guard-rescreen bin/studio bin/backroom bin/broker bin/teeny-core bin/openclaw bin/lib/*.sh bin/test/*.sh deploy/*.sh .github/scripts/*.sh
      - run: bin/test/pr_agent_budget_test.sh
      - run: bin/test/seed_cron_test.sh
      - run: bin/test/boot_cron_test.sh
      - run: bin/test/act_test.sh
      - run: bin/test/studio_test.sh
      - run: bin/test/model_windows_test.sh
      - run: bin/test/eval_test.sh
      - run: bin/test/inbound_consume_test.sh
      - run: bin/test/tell_test.sh
      - run: bin/test/frozen_test.sh
      - run: bin/test/tunnel_test.sh
      - run: bin/test/evolve_gate_test.sh
      - run: bin/test/evolve_test.sh
      - run: bin/test/memory_page_test.sh
      - run: bin/test/proofs_test.sh

  # bin/test/doctor_test.sh on its own: about a hundred bin/doctor runs, some
  # 8 minutes on the runner, as long as the rest of the shell tests and a
  # shard of the hands' together.
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install --quiet "cryptography>=38"
      - run: bin/test/doctor_test.sh

  # The hands' unit tests on Python 3.11 (the image's version), about 3,100 of
  # them, dealt out by whole test class across four runners (bin/test/hands_shard.py):
  # in one job they outgrew its 30 minutes on 2026-11-16. Every test runs in
  # exactly one shard, so the four together are `python3 -m unittest discover
  # -s hands/tests -t hands/tests`. None needs a core.
  hands:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      # hands/tests/reel reads the pinned MoneyPrinterTurbo's job model from
      # source, so a pin bump that renames a field Teeny sends fails here.
      - name: Fetch vendor/moneyprinter
        run: git submodule update --init --depth 1 vendor/moneyprinter
      # hands/tests/meme checks that what deploy/memegen/front.py replaces is
      # still in the pinned memegen.
      - name: Fetch vendor/memegen
        run: git submodule update --init --depth 1 vendor/memegen
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pillow at the image's version (python3-pil on bookworm is 9.4.0), and
      # required: a test that needs it fails here rather than skipping
      # (hands/tests/pillow_support.py).
      - run: python3 -m pip install --quiet "cryptography>=38" "Pillow==9.4.0"
      - run: python3 bin/test/hands_shard.py --shards 4 --shard ${{ matrix.shard }} -v
        env:
          TEENY_TESTS_REQUIRE_PILLOW: "1"

  # The OpenClaw-backed core (core/): typecheck, lint and the contract tests
  # on Node 24 (openclaw needs >= 24.16). Nothing here reaches a network
  # service; npm ci fetches only the locked packages.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # The required check (the ruleset "main: frozen gate" names `scripts`): green
  # only when the shell tests, the doctor's, every shard of the hands' tests
  # and the core's passed.
  scripts:
    if: always()
    needs: [scripts-shell, doctor, hands, core]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          SHELL_TESTS: ${{ needs.scripts-shell.result }}
          DOCTOR_TESTS: ${{ needs.doctor.result }}
          HANDS_TESTS: ${{ needs.hands.result }}
          CORE_TESTS: ${{ needs.core.result }}
        run: |
          echo "scripts-shell: $SHELL_TESTS, doctor: $DOCTOR_TESTS, hands: $HANDS_TESTS, core: $CORE_TESTS"
          [ "$SHELL_TESTS" = success ] && [ "$DOCTOR_TESTS" = success ] && [ "$HANDS_TESTS" = success ] && [ "$CORE_TESTS" = success ]

  frozen:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'teenydroid' || startsWith(github.head_ref, 'teeny/'))
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs the head from its merge base with main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The checker and its list are taken from the base, never the PR: a
      # candidate that edits bin/lib/frozen.py or evals/frozen.txt cannot
      # loosen the check that judges it (both are frozen besides). Two lines,
      # not a pipe: the default shell has no pipefail, and a missing checker
      # must fail the job, not run nothing.
      - name: Refuse changes to frozen paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE:bin/lib/frozen.py" >"$RUNNER_TEMP/frozen.py"
          python3 "$RUNNER_TEMP/frozen.py" --root . "$BASE" "$HEAD"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
