# Lint, test and build on every pull request.
#
# - spine: build teeny-spine from the vendored OpenHuman (the same release
#   profile the image builds), then boot it through bin/spine with a stub model
#   and run the whole live test: seeding, a shell job, bin/crons, bin/oh,
#   bin/ask, the keyring across a restart.
# - scripts: shellcheck over bin/, the reconciliation tests, and the hands'
#   unit tests on Python 3.11 (the image's version); none needs a core.
# - web: the Next.js site.
# - frozen: on Teeny's own pull requests only (opened by teenydroid, or from
#   any teeny/ branch, whoever opened it: a generation's teeny/gen-<n>, a
#   revert's teeny/revert-gen-<n>, a self job's teeny/<slug>), refuse any
#   change to a path in evals/frozen.txt
#   (docs/evolve.md, "What Teeny may change"). The operator's PRs skip it.
#
# Nothing here deploys. There is no deploy-on-merge: the box runs
# deploy/compose.yaml by hand (deploy/README.md).

name: check

on:
  pull_request:
  workflow_call:

jobs:
  spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # OpenHuman and its nested vendors, all public over https.
      - name: Fetch vendor/openhuman
        run: git submodule update --init --recursive --depth 1 --jobs 8 vendor/openhuman
      # The image's modules stage copies OpenHuman scripts piecemeal; their
      # imports must come along (this job has vendor/openhuman checked out).
      - run: bin/test/dockerfile_test.sh
      # OpenHuman links X11, xdo, evdev and ALSA on Linux.
      - name: Install system headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libasound2-dev libxdo-dev libxtst-dev \
            libx11-dev libxi-dev libevdev-dev libudev-dev sqlite3
      # Keep in step with rust-toolchain.toml (vendor/openhuman's).
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p teeny-spine
      - run: bin/test/spine_live_test.sh
        env:
          OPENHUMAN_CORE_BIN: target/release/teeny-spine

  scripts:
    runs-on: ubuntu-latest
    # The job takes about five minutes (the hands' suite about 90 s). A hung
    # test should fail the check in minutes, not hold a runner for GitHub's
    # six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # The hands and bin/lib/*.py: Python 3.11 standard library only (tomllib),
      # so no install step. The tests fake X and the core; nothing leaves the
      # runner.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # shellcheck and sqlite3 ship on the runner image.
      - run: shellcheck -x bin/oh bin/ask bin/act bin/doctor bin/eval bin/crons bin/heartbeat bin/spine bin/seed-cron bin/frozen-check bin/evolve bin/inbound-consume bin/mentions bin/mail bin/stats-snapshot bin/build-ship bin/tasks-desk bin/bounty-pay bin/tick bin/reflect bin/health bin/gh-inbound bin/proofs bin/accounts bin/wallet-watch bin/lib/*.sh bin/test/*.sh deploy/*.sh
      - run: bin/test/seed_cron_test.sh
      - run: bin/test/act_test.sh
      - run: bin/test/doctor_test.sh
      - run: bin/test/eval_test.sh
      - run: bin/test/inbound_consume_test.sh
      - run: bin/test/frozen_test.sh
      - run: bin/test/evolve_test.sh
      - run: bin/test/memory_page_test.sh
      - run: bin/test/proofs_test.sh
      - run: python3 -m unittest discover -s hands/tests -t hands/tests -v

  frozen:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'teenydroid' || startsWith(github.head_ref, 'teeny/'))
    runs-on: ubuntu-latest
    steps:
      # Full history: the check diffs the head from its merge base with main.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The checker and its list are taken from the base, never the PR: a
      # candidate that edits bin/lib/frozen.py or evals/frozen.txt cannot
      # loosen the check that judges it (both are frozen besides). Two lines,
      # not a pipe: the default shell has no pipefail, and a missing checker
      # must fail the job, not run nothing.
      - name: Refuse changes to frozen paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$BASE:bin/lib/frozen.py" >"$RUNNER_TEMP/frozen.py"
          python3 "$RUNNER_TEMP/frozen.py" --root . "$BASE" "$HEAD"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
