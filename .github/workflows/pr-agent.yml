# PR-Agent (github.com/The-PR-Agent/pr-agent) reviews every pull request and
# answers /review, /describe, /improve and /ask comments. Its model calls go to
# Surplus Intelligence, the OpenAI-compatible marketplace Teeny already buys
# from, on the SURPLUS_API_KEY repository secret (the same key as
# secrets/teeny.env on the box).
#
# Plain pull_request, not pull_request_target: a fork PR gets no secrets, so
# outside code never runs next to the key, and the job skips fork PRs rather
# than fail on the missing key. Comment commands are honoured only
# from the owner, members and collaborators, so strangers cannot spend it.
name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  # A newer push supersedes a review still running on the old head.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr_agent:
    name: PR Agent
    if: >-
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent
        # v0.50.0
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.SURPLUS_API_KEY }}
          OPENAI.API_BASE: https://api.surplusintelligence.ai/v1
          CONFIG.MODEL: openai/gpt-6.1-sol
          CONFIG.FALLBACK_MODELS: '["openai/gpt-6-luna"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "200000"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "false"
          # Re-review on every push to the PR (synchronize), skipping pushes
          # that are only a merge of the base branch or a bot's commit.
          GITHUB_ACTION_CONFIG.HANDLE_PUSH_TRIGGER: "true"
          GITHUB_ACTION_CONFIG.PUSH_COMMANDS: '["/review"]'
          GITHUB_ACTION_CONFIG.PUSH_TRIGGER_IGNORE_MERGE_COMMITS: "true"
          GITHUB_ACTION_CONFIG.PUSH_TRIGGER_IGNORE_BOT_COMMITS: "true"
