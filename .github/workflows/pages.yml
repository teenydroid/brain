# Checks that web/ still builds into the site GitHub Pages serves, at
# https://teenydroid.github.io/.
#
# Publishing happens in teenydroid/teenydroid.github.io, not here: its own
# workflow (.github/workflows/build.yml there) checks out this public
# repository every fifteen minutes, rebuilds the site when web/ has changed,
# and refreshes data/home.json and data/drops.json, all with that
# repository's own token. Nothing here holds a key to it.
#
# This job runs the same build, snapshots included, on every pull request and
# push to main that touches web/, so a change that would break the site shows
# up here rather than in the next run over there.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build the static site
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_SOLANA_RPC: ${{ vars.NEXT_PUBLIC_SOLANA_RPC }}
          NEXT_PUBLIC_SOLANA_RPC_DEVNET: ${{ vars.NEXT_PUBLIC_SOLANA_RPC_DEVNET }}
      - name: Snapshots into out/data
        run: npm run snapshot -- out/data
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Without it Pages runs Jekyll, which drops _next/ and .well-known/.
      - run: touch out/.nojekyll
      # What the Pages repository would serve: the pages, the snapshots, the
      # discovery files Pages must not drop.
      - name: Check the export
        run: |
          set -euo pipefail
          for f in index.html rewards/index.html sitemap.xml robots.txt .nojekyll icon.png \
                   .well-known/agent-card.json data/home.json data/drops.json; do
            test -s "out/$f" || test "$f" = .nojekyll -a -e "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          jq -e '.generatedAt and .anatomy and .repo and .receipts and .stats' out/data/home.json >/dev/null
          jq -e '.generatedAt and .drops' out/data/drops.json >/dev/null
