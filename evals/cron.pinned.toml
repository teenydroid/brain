# Jobs merged into brain/cron.toml at every seed, which Teeny cannot remove,
# reschedule or redefine (bin/lib/cron_policy.py). Frozen with the rest of
# evals/: these are the jobs that keep watch over the brain Teeny edits, so
# the brain does not get to switch them off. The evolve loop's jobs land
# here with it.
#
# Same format as brain/cron.toml; a pinned job may run any script under bin/.

# Read the mentions and answer the ones the core has drafted (bin/mentions).
# Operator-owned: the brain shapes the answers through playbooks/mentions.md,
# but not whether Teeny reads what is said to it.
[jobs.mentions-inbound]
schedule = "*/5 * * * *"
command = "bin/mentions"

# Read Teeny's mail and send the replies the core has drafted (bin/mail).
# Operator-owned for the same reason as mentions-inbound.
[jobs.mail-inbound]
schedule = "*/5 * * * *"
command = "bin/mail"

# One beat of Teeny's mind (bin/tick): it browses Moltbook for what was said
# back to it (at most every 10 minutes), then takes everything the inbound
# jobs above gathered as one batch on the one teeny:mind thread and carries
# out the intents it answers with through the hands. Two minutes after each
# ingest. A beat with an empty inbox makes no model call.
[jobs.tick]
schedule = "2-59/5 * * * *"
command = "bin/tick"

# Today's numbers from X, Moltbook and GitHub into the stats table
# (bin/stats-snapshot). The only numbers a post may quote come from there.
[jobs.stats-snapshot]
schedule = "15 0 * * *"
command = "bin/stats-snapshot"

# The builder (brain/agents/builder.toml), an agent job: it reads one job
# from its desk (state/workbench/desk/build.json: the oldest picked build
# request, or a small daily thing of its own), writes and tests it in
# state/workbench/<job>/, and leaves its report on the desk. It publishes
# nothing itself. Ten past, so build-ship has laid the desk out at the hour.
[jobs.builder]
schedule = "10 */2 * * *"
agent = "builder"
prompt = "Build the job on your desk, following your instructions."

# The builder's desk and shipping (bin/build-ship): collect its report, lay
# out its next job, and push what it finished to GitHub through hands/gh.
[jobs.build-ship]
schedule = "*/30 * * * *"
command = "bin/build-ship"

# The browser operator (brain/agents/operator.toml), an agent job: the one
# task on its desk (state/workbench/desk/task.json), done in the browser,
# reported on the desk.
[jobs.operator]
schedule = "40 * * * *"
agent = "operator"
prompt = "Do the browser task on your desk, following your instructions."

# The operator's desk (bin/tasks-desk): collect its report, lay out its next task.
[jobs.tasks-desk]
schedule = "*/15 * * * *"
command = "bin/tasks-desk"

# Pay the bounty prizes that are due (bin/bounty-pay): collect entries, take the
# winner's claim from the winner's own reply, and pay once the winner has been
# public for BOUNTY_CHALLENGE_HOURS, under hands/wallet's caps. Operator-owned:
# money moves only through this job and the wallet's caps, never a playbook.
[jobs.bounty-pay]
schedule = "23 * * * *"
command = "bin/bounty-pay"
