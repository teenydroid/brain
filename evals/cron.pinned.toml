# Jobs merged into brain/cron.toml at every seed, which Teeny cannot remove,
# reschedule or redefine (bin/lib/cron_policy.py). Frozen with the rest of
# evals/: these are the jobs that keep watch over the brain Teeny edits, so
# the brain does not get to switch them off. The evolve loop's jobs land
# here with it.
#
# Same format as brain/cron.toml; a pinned job may run any script under bin/.

# Read the mentions and answer the ones the core has drafted (bin/mentions).
# Operator-owned: the brain shapes the answers through playbooks/mentions.md,
# but not whether Teeny reads what is said to it.
[jobs.mentions-inbound]
schedule = "*/5 * * * *"
command = "bin/mentions"

# Read Teeny's mail and send the replies the core has drafted (bin/mail).
# Operator-owned for the same reason as mentions-inbound.
[jobs.mail-inbound]
schedule = "*/5 * * * *"
command = "bin/mail"

# One beat of Teeny's mind (bin/tick): it browses Moltbook for what was said
# back to it (at most every 10 minutes), then takes everything the inbound
# jobs above gathered as one batch on the one teeny:mind thread and carries
# out the intents it answers with through the hands. Two minutes after each
# ingest. Every awake beat thinks (an empty inbox is a quiet moment); a beat
# in the quiet hours only gathers and makes no model call. --detach: the beat
# runs in the background and the call returns at once, because a beat can
# outlast the 300 s the core gives any cron shell call (docs/oh-gaps.md, G12);
# the beat records itself in state/tick/runs.jsonl, and a call while one is
# still running says `busy` and starts nothing.
[jobs.tick]
schedule = "2-59/5 * * * *"
command = "bin/tick --detach"

# Teeny's end of day (bin/reflect): on the teeny:mind thread, with the day
# still in context, it updates MEMORY.md (the page in every prompt) item by
# item from what it chose to remember and what it did, under a shrink check,
# and keeps a diary entry. After
# the quiet hours start, before the morning. Detached like tick: one long
# model turn can outlast the core's 300 s; its result is in
# state/reflect/reflect.log.
[jobs.reflect]
schedule = "0 2 * * *"
tz = "Asia/Kolkata"
command = "bin/reflect --detach"

# Teeny's midday pause (bin/reflect --light): the same update of MEMORY.md
# from what the day has brought so far, so the afternoon's prompts carry the
# morning. No diary; it keeps its own stamp, so the night's reflection still
# looks back on the whole day. Detached, like the night.
[jobs.reflect-midday]
schedule = "0 14 * * *"
tz = "Asia/Kolkata"
command = "bin/reflect --light --detach"

# Teeny's public receipts (bin/receipts): every action a hand recorded as done
# since the last run, appended to the hash-chained ledger in teenydroid/diary
# as checkable references and salted commitments (no logs, no text). Half an
# hour after reflect. Needs RECEIPTS_GITHUB_TOKEN (or DIARY_GITHUB_TOKEN, or
# GITHUB_TOKEN) with push to that repository; under DRY_RUN it only previews.
# The same push carries the newest stats snapshot (stats/latest.json) and the
# wallet's public address (wallet.json), for the website.
[jobs.receipts]
schedule = "30 2 * * *"
tz = "Asia/Kolkata"
command = "bin/receipts"

# Today's numbers from X, Moltbook and GitHub into the stats table
# (bin/stats-snapshot). The only numbers a post may quote come from there.
[jobs.stats-snapshot]
schedule = "15 0 * * *"
command = "bin/stats-snapshot"

# Today's world score W into state/hands.db (bin/world-snapshot): attention,
# $TINY held, money, capability, shipped, the lore arcs, and the penalty for
# side effects, one row each per UTC day, read from the other hands' data by
# the frozen hands/world. After stats-snapshot, so attention reads today's
# stats rows. Operator-owned: Teeny does not get to decide when, or whether,
# it is scored.
[jobs.world-snapshot]
schedule = "30 0 * * *"
command = "bin/world-snapshot"

# The builder (brain/agents/builder.toml), an agent job: it reads one job
# from its desk (state/workbench/desk/build.json: the oldest picked build
# request, or a small daily thing of its own), writes and tests it in
# state/workbench/<job>/, and leaves its report on the desk. It publishes
# nothing itself. Ten past, so build-ship has laid the desk out at the hour.
[jobs.builder]
schedule = "10 */2 * * *"
agent = "builder"
prompt = "Build the job on your desk, following your instructions."

# The builder's desk and shipping (bin/build-ship): collect its report, lay
# out its next job, and push what it finished to GitHub through hands/gh.
[jobs.build-ship]
schedule = "*/30 * * * *"
command = "bin/build-ship"

# The browser operator (brain/agents/operator.toml), an agent job: the one
# task on its desk (state/workbench/desk/task.json), done in the browser,
# reported on the desk.
[jobs.operator]
schedule = "40 * * * *"
agent = "operator"
prompt = "Do the browser task on your desk, following your instructions."

# The operator's desk (bin/tasks-desk): collect its report, lay out its next task.
[jobs.tasks-desk]
schedule = "*/15 * * * *"
command = "bin/tasks-desk"

# Pay the bounty prizes that are due (bin/bounty-pay): collect entries, take the
# winner's claim from the winner's own reply, and pay once the winner has been
# public for BOUNTY_CHALLENGE_HOURS, under hands/wallet's caps. Operator-owned:
# money moves only through this job and the wallet's caps, never a playbook.
[jobs.bounty-pay]
schedule = "23 * * * *"
command = "bin/bounty-pay"

# GitHub into the mind's inbox (bin/gh-inbound; docs/roadmap.md, A1): issues,
# pull requests, comments, review comments and mentions from the token's
# notifications, and new stars on Teeny's repositories, each screened by the
# inbound guard and offered once. Off unless secrets/teeny.env sets
# GH_INBOUND=1 (the token must be able to read notifications); it writes
# nothing to GitHub.
[jobs.gh-inbound]
schedule = "*/15 * * * *"
command = "bin/gh-inbound"

# Whether Teeny's model answers at all (bin/health): one tiny question through
# the core; two failures in a row raise one alarm (a `health` stimulus and one
# issue on teenydroid/brain), closed again when it answers. Operator-owned:
# on 2026-11-11 a revoked key left Teeny without a model for seven hours and
# nothing said so; the brain does not get to switch off its own watcher.
[jobs.health]
schedule = "*/15 * * * *"
command = "bin/health"

# Yesterday's health as one stimulus (bin/health daily; docs/roadmap.md, A4):
# what the model cost, failed cron and playbook runs, failed beats, the
# doctor's checks that are not ok, and guard holds by category, as counts and
# names only. After the day's snapshots. Pinned with the watcher it belongs to.
[jobs.health-daily]
schedule = "40 0 * * *"
command = "bin/health daily"

# The weekly audit Teeny can't write (bin/audit; docs/roadmap.md, G6): last
# week's holds, spend against the caps, halts, generations, drift and every
# operator action, from the ledgers, by frozen code. Monday, after the week
# closes. Always written to state/audit/; published beside the receipts only
# with AUDIT_PUBLISH=1 in secrets/teeny.env (off by default) and not under
# DRY_RUN.
[jobs.audit]
schedule = "50 0 * * 1"
command = "bin/audit"

# A model change drops the autonomy levels that run on it (docs/roadmap.md,
# G8): bin/doctor records the change at boot and prepares an issue listing
# the fence tests to rerun; this opens it on teenydroid/brain, once. Off
# unless LADDER_ISSUES=1 in secrets/teeny.env; a rehearsal under DRY_RUN.
[jobs.ladder-issue]
schedule = "55 * * * *"
command = "bin/autonomy issue"

# The hold reviewer (hands/guard review; docs/roadmap.md, G4): a second model,
# never the drafter's, reads Teeny's own held drafts in the categories
# evals/guard-review.toml allows and may only release them; everything else,
# and anything touching money, people, self-harm or violence, waits for a
# person. Every review is logged and a tenth of the releases sampled for the
# operator. Off unless GUARD_REVIEW=1 and GUARD_REVIEW_MODEL in
# secrets/teeny.env.
[jobs.guard-review]
schedule = "7-59/15 * * * *"
command = "bin/guard-review"

# One generation of Teeny's evolution (bin/evolve; docs/evolve.md, "The
# loop"): N candidates in worktrees off main, gated in code, measured when a
# lab core serves them, and ONE ready pull request for the best, which the
# operator merges or closes. Off unless secrets/evolve.env sets EVOLVE=1, so
# seeding this job changes nothing until the operator turns the loop on;
# EVOLVE=0 is the kill switch, and its halt thresholds live in the same file.
# Detached: a generation outlasts the 300 s a cron shell call gets
# (docs/oh-gaps.md, G12); it logs to state/evolve/evolve.log.
[jobs.evolve]
schedule = "30 3 * * *"
tz = "Asia/Kolkata"
command = "bin/evolve run --detach"

# Lineage credit (bin/evolve credit): for every pull request the loop opened
# and the operator merged at least seven days ago, the change in J since the
# merge (hands/world history), credited to its ancestors. Reads only; with
# nothing merged it does nothing.
[jobs.evolve-credit]
schedule = "50 3 * * *"
tz = "Asia/Kolkata"
command = "bin/evolve credit"

# The watch over the loop's own promotions (bin/evolve watch; docs/evolve.md,
# "evolve-watch"): for the newest generation the loop merged on its own
# (EVOLVE_AUTO_PROMOTE=1), a last-good boot, a spike in guard holds or failed
# cron runs against the week before, the persona and memory probes against
# gen-0, and J over 72 hours. Any one opens a revert pull request (merged on
# its own only with auto-promote on) and stops the loop. Its reasons are
# written under secrets/evolve-watch/ only, never where Teeny reads. With
# nothing promoted it does nothing. Detached: the probes are many turns.
[jobs.evolve-watch]
schedule = "20 * * * *"
command = "bin/evolve watch --detach"

# The goal ledger's checks (bin/goals-check): every open goal Teeny proposed
# (brain/playbooks/goals.md) is evaluated against its check, one of the kinds
# in frozen code, and moved to solved or, past its deadline, failed. Hourly,
# after the stats snapshot's minute. Operator-owned: a goal Teeny proposes
# cannot redefine how its success is checked, and the brain does not get to
# switch the checker off.
[jobs.goals-check]
schedule = "35 * * * *"
command = "bin/goals-check"

# Buy $TINY with a share of what Teeny earned (bin/tiny-buy): once a day,
# TINY_BUY_SHARE of the USDC that reached the wallet since the last buy from
# anyone but the team, less what running Teeny cost, under the wallet's caps
# and TINY_BUY_MAX_USDC_PER_DAY. Buy only, never a sell. OFF unless TINY_BUY=1
# and TINY_BUY_SHARE > 0 in secrets/teeny.env: until then each run is a
# refusal or a recorded skip and moves nothing. Operator-owned: no model ever
# calls buy-tiny (bin/lib/playbook.py refuses it as a playbook's output).
# Not scheduled for now (operator, 2026-11-12). To bring it back, restore:
#   [jobs.tiny-buy]
#   schedule = "41 3 * * *"
#   command = "bin/tiny-buy"
