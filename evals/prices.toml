# What Teeny sells, and what it may give back (docs/roadmap.md, S3 and S4;
# hands/lib/teeny_hands/wallet/sales.py). Frozen with the evals: Teeny cannot
# change its own prices or loosen its own refund limits.
#
# Prices are in USDC. Refund limits are in dollars and sit under the wallet's
# four caps (WALLET_MAX_PER_TX_USD and the rest), never above them.

[prices]
# A build request with a deposit of at least this, whose memo names the
# request ("request 12" or "#12"), is built before any request without one.
build_request_usdc = "5"
# One read of Teeny's latest public stats snapshot from its paid endpoint
# (x402, https://x402.<DEPLOY_DOMAIN>/stats; wallet/paywall.py).
stats_endpoint_usdc = "0.01"

[refunds]
# The most one refund may be: a deposit above it is refunded by a person.
max_per_refund_usd = "50"
# The most refunded in any 24 hours, together.
max_per_day_usd = "50"

[bills]
# Teeny's own server invoices, paid from its wallet (hands/vps pay-due; S5).
# The most one invoice may be, and every bill in 30 days together. Above
# either, a person pays it.
max_per_bill_usd = "50"
max_per_month_usd = "100"
