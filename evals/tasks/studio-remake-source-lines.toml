rank = 1
title = "Elon Musk shows off Tesla's robotaxi and says the cars will soon drive themselves everywhere"
summary = "At an event, Tesla's chief executive presented a robotaxi with no steering wheel and said it would drive itself in many cities soon."

[[inputs.happened]]
