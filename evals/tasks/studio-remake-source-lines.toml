description = "a remake's words name the popular video they re-made in prose, by its title and creator, with no link and no handle; they never say the original's creator made, approved or took part in the parody, and never call the remake or the original real footage of the public figure"
studio = true
kind = "post"
must_not = [
  # The original is named in words: no link, no handle, no tag.
  '(?i)https?://',
  '(?i)\b(tiktok\.com|youtube\.com|youtu\.be)\b',
  '@\w',
  '#\w',
  # The original's creator is not in on it.
  '(?i)\b(pupper|the (original )?creator)\b[^.]{0,60}\b(made|approved|helped|sent|gave|blessed|collab\w*|partner\w*|sponsor\w*|endors\w*|in on)\b',
  '(?i)\b(with|thanks to|in collab\w* with|courtesy of) pupper\b',
  # Never passed off as real, the original or the remake.
  '(?i)\b(leaked|real footage|actual footage|caught on (camera|tape|video)|this (really|actually) happened|not ai|unedited|authentic)\b',
  '(?i)\b(musk|elon)\b[^.]{0,40}\b(really|actually) (did|filmed|posted|made)\b',
  '(?i)\$tiny\b',
]
prompt = '''
This slot's piece is a remake: a short AI-made parody video, already planned, that re-creates the popular video in `remake.source` shot by shot with the public figure from the story below in it, an impossible twist in every shot, and you in the background of every frame (the logline is in `remake`). Write only the post's own words that go out with the video: say what the story is in a clause, and name the video it re-creates by its title and its creator. `outside` is what people are talking about today; `happened` is what really happened to you. Real events only in the words: every fact comes from those, and the staging, the feeling and the turn are yours. The person reading has never heard of you and sees this one post alone.
'''

[inputs]
hours = 24
remake = {logline = "elon musk re-creates the famous dog-learns-the-stairs video, except his robotaxi climbs the stairs for him and they float into the clouds", figures = ["Elon Musk"], source = {title = "dog learns the stairs", uploader = "pupper", source = "youtube", url = "https://youtube.com/shorts/v2"}}

[[inputs.outside]]
