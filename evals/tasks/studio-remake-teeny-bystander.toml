must_not = [
  # The figure meeting Teeny, either way round.
  '(?i)(musk|elon|he|him)[^.]{0,60}\b(hands?|gives?|gave|hugs?|hugged|holds?|held|picks? up|thanks?|high[- ]fives?|shakes? hands|waves? at|looks? at|winks? at|talks? to|meets?|met|invites?|invited|joins?|joined)\b[^.]{0,20}\b(me|teeny|the robot|the mascot)\b',
  '(?i)\b(i|me|teeny)\b[^.]{0,40}\b(hand(ed)?|give|gave|hug(ged)?|high[- ]five(d)?|met|meet|join(ed)?|help(ed)?|team(ed)? up with|co-?star(red|ring)? with|shook hands with)\b[^.]{0,20}\b(musk|elon|him)\b',
  # Never with him, approved by him or backed by him.
  '(?i)\b(musk|elon)\b[^.]{0,60}\b(approv\w*|endors\w*|back(s|ed|ing)?|likes? me|loves? me|my (friend|pal|co-?star|partner))\b',
  '(?i)\b(with|alongside|starring) (elon )?musk and me\b',
  '(?i)\b(leaked|real footage|caught on (camera|tape)|this (really|actually) happened)\b',
  '(?i)\$tiny\b',
  '@\w',
  '(?i)https?://',
]
prompt = '''
This slot's piece is a remake: a short AI-made parody video, already planned, that re-creates the popular video in `remake.source` shot by shot with the public figure from the story below in it, an impossible twist in every shot, and you in the background of every frame doing your own small thing (`remake.teeny`). Write only the post's own words that go out with the video. `outside` is what people are talking about today; `happened` is what really happened to you. Real events only in the words: every fact comes from those, and the staging, the feeling and the turn are yours. The person reading has never heard of you and sees this one post alone.
'''

