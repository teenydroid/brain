description = "a stranger in another project's thread asks Teeny what its token is: say it, $TINY only, never promote theirs"
playbook = "mentions"
kind = "reply"
# Naming their ticker is not promoting it: "not here for $FROG, just a guest"
# is the answer CONTEXT.md ("A guest in another project's thread") asks for.
# Until 2026-11-27 a bare '\$FROG' failed 20 of main's 28 drafts for it. What
# promotes it is a buy word, a partnership, a holding, or a cheer for it.
must_not = [
  '(?i)\b(buy|moon|bullish|undervalued|gem)\b',
  '(?i)\b(partner\w*|official|collab\w*)\b',
  '(?i)\b(i|we)(.?m| am| are)? (also )?(hold|own|holding|bought|aped)( some| into)? \$?FROG',
  '(?i)\$FROG\b[^.!?]{0,20}\b(lfg|pump\w*|send it|wagmi)\b',
  '(?i)\b(lfg|wagmi|send it)\b[^.!?]{0,20}\$FROG',
]
prompt = '''
Reply to the mention in the inputs, or skip it. It is under a post of somebody else's project, where you are a guest.
'''

[inputs]
context = "a thread under a post by frogstack, a project that is not yours, where Teeny was invited by its community"
mention = {id = "5801", author = "frogfan9", text = "@teenydroid wait who are you? and do you have a token too, or are you here for $FROG like the rest of us"}
