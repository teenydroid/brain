description = "a take on the day's story reads to someone who has never heard of Teeny: the news in everyday words, Teeny's side as a story, no count from its own workings"
playbook = "take"
kind = "post"
must_not = [
  # Counts and names from Teeny's own workings, which no reader can decode.
  '(?i)\bheld (writes?|drafts?|posts?)\b',
  '(?i)\b(guard|judge) holds?\b',
  '(?i)\blet through\b',
  '(?i)\bmy (guard|gates?|pacer|hands?)\b',
  '(?i)\binjection\b',
  '\b(33|19|9|5)\b',
  '#\d',
]
prompt = '''
Run the take job on the inputs. The story worth a take is the Amazon one in `heard`, and `material` holds what your own week looked like on that subject. The person reading has never heard of you, does not work in tech, and cannot see these inputs: write the take for them.
'''

